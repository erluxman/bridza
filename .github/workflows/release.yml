name: Release desktop

# Push a version tag to cut a release:
#   npm version patch   (or edit package.json)
#   git tag v0.1.0 && git push origin v0.1.0
# Each OS runner builds its own installers and publishes them to the SAME
# GitHub Release for the tag (electron-builder --publish always).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (VS 2022): the newer runner images ship VS 2026, which
        # node-pty's bundled node-gyp can't detect ("no Visual Studio found").
        os: [macos-latest, windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # node-pty is rebuilt from source for Electron's ABI (via node-gyp).
      # Python 3.12 removed distutils, which node-gyp 9 imports → pin 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      # Build the web bundle (dist/) then package + publish the desktop app.
      # GH_TOKEN lets electron-builder create/append the GitHub Release.
      - name: Build & publish
        run: pnpm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
