});

/* ------------------------------------------------------------------ *
 *  STORAGE — JSON rendering + syntax highlight                       *
 * ------------------------------------------------------------------ */
const JSON_DOCS={
  verify:{path:&quot;stages/verify.stage.json&quot;, schema:&quot;bridza.stage/v1&quot;, data:STAGES.verify,
    comments:{
      &quot;\&quot;status\&quot;:&quot;:&quot;reflects latest run&quot;,
      &quot;\&quot;systemPromptRef\&quot;:&quot;:&quot;snapshot ref → drift is auditable&quot;,
      &quot;\&quot;commit\&quot;: null&quot;:&quot;failed run produced no result commit&quot;
    }},
  build:{path:&quot;stages/build.stage.json&quot;, schema:&quot;bridza.stage/v1&quot;, data:STAGES.build,
    comments:{&quot;\&quot;status\&quot;: \&quot;running\&quot;&quot;:&quot;currently executing&quot;}},
  graph:{path:&quot;graph.json&quot;, schema:&quot;bridza.graph/v1&quot;, data:GRAPH,
    comments:{&quot;\&quot;nodes\&quot;:&quot;:&quot;positions only — dragging edits here&quot;,&quot;\&quot;edges\&quot;:&quot;:&quot;wires only&quot;}},
  task:{path:&quot;task.json&quot;, schema:&quot;bridza.task/v1&quot;, data:TASK_META,
    comments:{&quot;\&quot;cursor\&quot;:&quot;:&quot;which stage is active&quot;}},
  research:{path:&quot;stages/research.stage.json&quot;, schema:&quot;bridza.stage/v1&quot;, data:STAGES.research, comments:{}}
};
let activeJson=&quot;verify&quot;;

function highlight(json){
  // token colouring
  return json.replace(/(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&quot;])*&quot;(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+\.?\d*([eE][+-]?\d+)?)/g,m=>{
    let cls=&quot;tok-num&quot;;
    if(/^&quot;/.test(m)){cls=/:$/.test(m)?&quot;tok-key&quot;:&quot;tok-str&quot;;}
    else if(/true|false/.test(m))cls=&quot;tok-bool&quot;;
    else if(/null/.test(m))cls=&quot;tok-null&quot;;
    return `<span class=&quot;${cls}&quot;>${m}</span>`;
  });
}

function renderJSON(key){
  activeJson=key;
  const doc=JSON_DOCS[key];
  let raw=JSON.stringify(doc.data,null,2);
  let html=highlight(esc(raw));
  // inline comments on selected lines
  Object.entries(doc.comments).forEach(([needle,note])=>{
    html=html.split(&quot;\n&quot;).map(line=>{
      if(line.replace(/<[^>]+>/g,&quot;&quot;).includes(needle))
        return line.replace(/(,?)\s*$/,'$1  <span class=&quot;tok-com&quot;>// '+esc(note)+'</span>');
      return line;
    }).join(&quot;\n&quot;);
  });
  $(&quot;#jsonView&quot;).innerHTML=html;
  $(&quot;#jsonPath&quot;).textContent=doc.path;
  $(&quot;#jsonSchema&quot;).textContent=doc.schema;
  $$(&quot;#jsonSwitch button&quot;).forEach(b=>b.classList.toggle(&quot;active&quot;,b.dataset.json===key));
  $$(&quot;#tree .row.file&quot;).forEach(r=>r.classList.toggle(&quot;active&quot;,r.dataset.json===key));
}
$$(&quot;#jsonSwitch button&quot;).forEach(b=>b.onclick=()=>renderJSON(b.dataset.json));
$$(&quot;#tree .row.file&quot;).forEach(r=>r.onclick=()=>renderJSON(r.dataset.json));

/* ------------------------------------------------------------------ *
 *  INIT                                                              *
 * ------------------------------------------------------------------ */
buildNodes();
growCanvas();
requestAnimationFrame(drawWires); // wait for layout so node heights are real
renderJSON(&quot;verify&quot;);
</script>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');
const attr=t=>esc(t).replace(/&quot;/g,'&amp;quot;');
const STLABEL={research:&quot;Research&quot;,planning:&quot;Planning&quot;,spec:&quot;Spec&quot;,build:&quot;Build&quot;,verify:&quot;Verify&quot;};
const AV={system:&quot;SYS&quot;,user:&quot;USR&quot;,assistant:&quot;AI&quot;};
const AVCLS={system:&quot;av-sys&quot;,user:&quot;av-usr&quot;,assistant:&quot;av-asst&quot;};
const ROLECLS={system:&quot;sys&quot;,user:&quot;usr&quot;,assistant:&quot;asst&quot;};
const ROLELBL={system:&quot;System prompt&quot;,user:&quot;User prompt&quot;,assistant:&quot;Assistant response&quot;};
function fmt(ts){ if(!ts) return &quot;—&quot;; const d=new Date(ts); return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

/* ---------- render RAIL ---------- */
function renderRail(){
  const r=$('#rail'); r.innerHTML='';
  STAGES.forEach((st,i)=>{
    const runs=st.runs.length;
    const el=document.createElement('div');
    el.className='railstep '+st.status;
    el.onclick=()=>document.getElementById('stage-'+st.index).scrollIntoView({behavior:'smooth',block:'start'});
    el.innerHTML=`
      <div class=&quot;node&quot;><div class=&quot;bead&quot;></div></div>
      <div class=&quot;lbl&quot;>
        <div class=&quot;n&quot;>${String(st.index).padStart(2,'0')} · ${STLABEL[st.stage]}${runs>1?`<span class=&quot;runsbadge&quot;>${runs} runs</span>`:''}</div>
        <div class=&quot;s&quot;>${st.status}${st.status==='done'&amp;&amp;runs===1?' · 1 run':''}</div>
      </div>`;
    r.appendChild(el);
  });
}

/* ---------- render THREAD ---------- */
function renderThread(){
  const t=$('#thread'); t.innerHTML='';
  STAGES.forEach(st=>{
    const wrap=document.createElement('div');
    wrap.id='stage-'+st.index;
    wrap.dataset.stage=st.stage;

    /* separator */
    let html=`<div class=&quot;stagesep&quot;>
        <span class=&quot;barnum&quot;>${String(st.index).padStart(2,'0')}</span>
        <h2>${STLABEL[st.stage]} <span class=&quot;stat ${st.status}&quot;>${st.status}</span></h2>
        <span class=&quot;flex&quot;></span>
      </div>`;

    /* pinned summary chip (stage-level, editable) */
    html+=`<div class=&quot;summary&quot;>
        <span class=&quot;pin&quot;><svg viewBox=&quot;0 0 24 24&quot; width=&quot;15&quot; height=&quot;15&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z&quot;/></svg></span>
        <div class=&quot;txt&quot;><span class=&quot;k&quot;>Response summary</span><span contenteditable=&quot;true&quot; data-edit=&quot;summary&quot; data-stage=&quot;${st.stage}&quot; spellcheck=&quot;false&quot;>${esc(st.summary)}</span><span class=&quot;edithint&quot;>✎ click to edit</span></div>
      </div>`;

    /* run tabs (only when >1 run) */
    if(st.runs.length>1){
      html+=`<div class=&quot;runtabs&quot; data-runtabs=&quot;${st.stage}&quot;>`;
      st.runs.forEach((run,idx)=>{
        html+=`<div class=&quot;runtab ${idx===st.activeRun?'on':''}&quot; data-runtab=&quot;${st.stage}:${idx}&quot; onclick=&quot;pickRun('${st.stage}',${idx})&quot;>
          <span class=&quot;rd ${run.status}&quot;></span>Run #${run.n} · ${run.status}${run.meta.commit?` · <span style=&quot;color:var(--accent)&quot;>${run.meta.commit}</span>`:''}</div>`;
      });
      html+=`</div>`;
    }

    /* run bodies */
    st.runs.forEach((run,idx)=>{
      html+=`<div data-runbody=&quot;${st.stage}:${idx}&quot; ${idx===st.activeRun?'':'class=&quot;hide&quot;'}>`;

      if(run.rerunReason){
        html+=`<div class=&quot;rerun-note&quot;><svg viewBox=&quot;0 0 24 24&quot; width=&quot;14&quot; height=&quot;14&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M1 4v6h6M23 20v-6h-6&quot;/><path d=&quot;M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15&quot;/></svg>Re-run: ${esc(run.rerunReason)}</div>`;
      }

      /* run meta bar — tool/model/timing/status/exit/commit */
      const m=run.meta;
      html+=`<div class=&quot;runmeta&quot;>
        <span class=&quot;mchip&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;2&quot;/><path d=&quot;M8 9l3 3-3 3M13 15h3&quot;/></svg>tool <b>${m.tool}</b></span>
        <span class=&quot;mchip&quot;>model <b>${m.model}</b></span>
        <span class=&quot;mchip&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/><path d=&quot;M12 7v5l3 2&quot;/></svg>${fmt(m.start)} → ${m.finish?fmt(m.finish):'…'} · <b>${m.duration}</b></span>
        <span class=&quot;mchip ${run.exit===0?'exit0':run.exit===null?'':'exitn'}&quot;>status <b>${run.status}</b>${run.exit!==null?` · exit <b>${run.exit}</b>`:''}</span>`;
      if(m.commit){
        html+=`<span class=&quot;mchip sha&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3&quot;/><path d=&quot;M12 1v6M12 17v6&quot;/></svg>commit <b>${m.commit}</b></span>`;
      } else if(run.status==='failed'){
        html+=`<span class=&quot;mchip exitn&quot;>commit <b>none — build broken</b></span>`;
      } else if(run.status==='running'){
        html+=`<span class=&quot;mchip&quot;>commit <b>pending…</b></span>`;
      }
      html+=`</div>`;

      if(m.failure){
        html+=`<div class=&quot;rerun-note&quot; style=&quot;color:var(--fail);background:var(--fail-bg);border-color:#4a1c1e&quot;><svg viewBox=&quot;0 0 24 24&quot; width=&quot;14&quot; height=&quot;14&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M12 9v4M12 17h.01&quot;/><path d=&quot;M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z&quot;/></svg>Failure: ${esc(m.failure)}</div>`;
      }

      /* bubbles */
      run.messages.forEach((msg,mi)=>{
        const rc=ROLECLS[msg.role];
        html+=`<div class=&quot;bubble&quot; data-role=&quot;${msg.role}&quot;>
          <div class=&quot;avatar ${AVCLS[msg.role]}&quot;>${AV[msg.role]}</div>
          <div class=&quot;body&quot;>
            <div class=&quot;rolehdr&quot;>
              <span class=&quot;role ${rc}&quot;>${ROLELBL[msg.role]}</span>`;
        if(msg.role==='system'&amp;&amp;msg.meta){
          html+=`<span class=&quot;src&quot;>${msg.meta.source} · snapshot ${fmt(msg.meta.snapshotAt)}</span>`;
        }
        html+=`<button class=&quot;editbtn&quot; onclick=&quot;toggleEdit(this)&quot;>edit</button></div>`;

        const cid=`c-${st.stage}-${idx}-${mi}`;
        if(msg.role==='system'){
          html+=`<div class=&quot;content sys sys-collapsed&quot; id=&quot;${cid}&quot;>${esc(msg.content)}</div>
            <span class=&quot;sys-toggle&quot; onclick=&quot;toggleSys('${cid}',this)&quot;><svg viewBox=&quot;0 0 24 24&quot; width=&quot;11&quot; height=&quot;11&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot;><path d=&quot;M6 9l6 6 6-6&quot;/></svg>show full system prompt</span>`;
        } else {
          html+=`<div class=&quot;content ${rc}&quot; id=&quot;${cid}&quot;>${esc(msg.content)}</div>`;
        }

        /* per-message summary (assistant &quot;what changed&quot;) */
        if(msg.summary){
          html+=`<div class=&quot;summary&quot; style=&quot;margin:9px 0 0;border-left-color:var(--asst)&quot;><span class=&quot;pin&quot; style=&quot;color:var(--asst)&quot;><svg viewBox=&quot;0 0 24 24&quot; width=&quot;13&quot; height=&quot;13&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M9 11l3 3L22 4&quot;/><path d=&quot;M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11&quot;/></svg></span><div class=&quot;txt&quot;><span class=&quot;k&quot;>What changed</span><span contenteditable=&quot;true&quot; data-edit=&quot;msgsummary&quot; spellcheck=&quot;false&quot;>${esc(msg.summary)}</span><span class=&quot;edithint&quot;>✎</span></div></div>`;
        }

        /* attachments strip — files changed w/ add/mod/del */
        if(msg.attachments&amp;&amp;msg.attachments.length){
          html+=`<div class=&quot;attach&quot;><div class=&quot;ahdr&quot;>Files changed<span class=&quot;cnt&quot;>${msg.attachments.length}</span></div><div class=&quot;strip&quot;>`;
          msg.attachments.forEach(f=>{
            const mk=f.change==='add'?'A':f.change==='mod'?'M':'D';
            html+=`<div class=&quot;file&quot;>
              <span class=&quot;mark ${f.change}&quot;>${mk}</span>
              <span class=&quot;path&quot;>${f.path}</span>
              <span class=&quot;diff&quot;><span class=&quot;p&quot;>+${f.plus}</span><span class=&quot;m&quot;>−${f.minus}</span></span>
            </div>`;
          });
          html+=`</div></div>`;
        }

        html+=`</div></div>`; /* close body, bubble */
      });

      /* audit footer */
      html+=`<div class=&quot;auditbar&quot;>
        <span><b>run</b> #${run.n} of ${st.runs.length}</span>
        <span><b>started by</b> ${m.startedBy}</span>
        <span><b>at</b> ${fmt(m.start)}</span>
        <span><b>duration</b> ${m.duration}</span>
        ${m.editedBy?`<span><b>last edited</b> ${m.editedBy} · ${fmt(m.editedAt)}</span>`:`<span><b>edits</b> none</span>`}
        ${m.commitMsg?`<span><b>commit msg</b> ${esc(m.commitMsg)}</span>`:''}
      </div>`;

      html+=`</div>`; /* close runbody */
    });

    wrap.innerHTML=html;
    t.appendChild(wrap);
  });

  /* wire editable save */
  document.querySelectorAll('[contenteditable=&quot;true&quot;]').forEach(n=>{
    n.addEventListener('blur',()=>{
      if(n.dataset.edit==='summary'){
        const s=STAGES.find(x=>x.stage===n.dataset.stage); if(s) s.summary=n.textContent;
      }
      showToast();
    });
  });
}

/* run tab switching */
function pickRun(stage,idx){
  const st=STAGES.find(x=>x.stage===stage); st.activeRun=idx;
  document.querySelectorAll(`[data-runtab^=&quot;${stage}:&quot;]`).forEach(t=>t.classList.toggle('on',t.dataset.runtab===`${stage}:${idx}`));
  document.querySelectorAll(`[data-runbody^=&quot;${stage}:&quot;]`).forEach(b=>b.classList.toggle('hide',b.dataset.runbody!==`${stage}:${idx}`));
}

/* system prompt expand */
function toggleSys(id,btn){
  const el=document.getElementById(id); const open=el.classList.toggle('sys-collapsed')===false;
  btn.innerHTML=open
    ?'<svg viewBox=&quot;0 0 24 24&quot; width=&quot;11&quot; height=&quot;11&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot;><path d=&quot;M18 15l-6-6-6 6&quot;/></svg>hide system prompt'
    :'<svg viewBox=&quot;0 0 24 24&quot; width=&quot;11&quot; height=&quot;11&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot;><path d=&quot;M6 9l6 6 6-6&quot;/></svg>show full system prompt';
}

/* edit a bubble in place */
function toggleEdit(btn){
  const bubble=btn.closest('.body'); const content=bubble.querySelector('.content');
  const editing=content.getAttribute('contenteditable')==='true';
  if(editing){
    content.setAttribute('contenteditable','false'); btn.textContent='edit'; btn.classList.remove('editing');
    content.classList.remove('flash'); void content.offsetWidth; content.classList.add('flash');
    showToast();
  } else {
    content.classList.remove('sys-collapsed');
    content.setAttribute('contenteditable','true'); content.focus(); btn.textContent='done'; btn.classList.add('editing');
  }
}

/* rail active-on-scroll */
function initScrollSpy(){
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const idx=e.target.id.split('-')[1];
        document.querySelectorAll('.railstep').forEach((r,i)=>r.classList.toggle('active',i===(+idx-1)));
      }
    });
  },{rootMargin:'-40% 0px -55% 0px'});
  STAGES.forEach(s=>io.observe(document.getElementById('stage-'+s.index)));
}

/* JSON printer with syntax + checklist map. Build the mapped 04-build.json by default. */
function buildJSON(stageKey){
  if(stageKey==='task'){
    return jsonFor({
      &quot;id&quot;:TASK.id,&quot;title&quot;:TASK.title,&quot;flow&quot;:TASK.flow,&quot;branch&quot;:TASK.branch,
      &quot;pipeline&quot;:&quot;engineering&quot;,&quot;createdBy&quot;:&quot;alex@studio&quot;,&quot;created&quot;:&quot;2026-07-06T08:29:00Z&quot;
    },{&quot;\&quot;id\&quot;:&quot;:&quot;task id&quot;,&quot;\&quot;title\&quot;:&quot;:&quot;task title&quot;,&quot;\&quot;flow\&quot;:&quot;:&quot;flow&quot;,&quot;\&quot;branch\&quot;:&quot;:&quot;git branch&quot;,&quot;\&quot;createdBy\&quot;:&quot;:&quot;audit: created by&quot;});
  }
  const st=STAGES.find(s=>s.stage===stageKey);
  const obj={
    stage:st.stage,index:st.index,flow:TASK.flow,task:TASK.id,branch:TASK.branch,
    status:st.status,activeRun:st.activeRun,summary:st.summary,
    runs:st.runs.map(r=>{
      const o={n:r.n,status:r.status,exit:r.exit};
      if(r.rerunReason)o.rerunReason=r.rerunReason;
      o.meta=r.meta;
      o.messages=r.messages;
      return o;
    })
  };
  const map={
    &quot;\&quot;stage\&quot;:&quot;:&quot;stage name&quot;,&quot;\&quot;status\&quot;:&quot;:&quot;status&quot;,&quot;\&quot;summary\&quot;:&quot;:&quot;response summary&quot;,&quot;\&quot;runs\&quot;:&quot;:&quot;re-runs live here&quot;,
    &quot;\&quot;n\&quot;: 1&quot;:&quot;run # (audit)&quot;,&quot;\&quot;n\&quot;: 2&quot;:&quot;run # (audit)&quot;,
    &quot;\&quot;exit\&quot;:&quot;:&quot;exit code&quot;,&quot;\&quot;rerunReason\&quot;:&quot;:&quot;audit: why re-run&quot;,
    &quot;\&quot;tool\&quot;:&quot;:&quot;tool&quot;,&quot;\&quot;model\&quot;:&quot;:&quot;model&quot;,&quot;\&quot;startedBy\&quot;:&quot;:&quot;audit: who ran it&quot;,
    &quot;\&quot;editedBy\&quot;:&quot;:&quot;audit: last editor&quot;,&quot;\&quot;editedAt\&quot;:&quot;:&quot;audit: last edited at&quot;,
    &quot;\&quot;start\&quot;:&quot;:&quot;start time&quot;,&quot;\&quot;finish\&quot;:&quot;:&quot;finish time&quot;,
    &quot;\&quot;duration\&quot;:&quot;:&quot;duration&quot;,&quot;\&quot;commit\&quot;:&quot;:&quot;result commit sha&quot;,&quot;\&quot;failure\&quot;:&quot;:&quot;failure reason&quot;,
    &quot;\&quot;role\&quot;: \&quot;system\&quot;&quot;:&quot;system prompt →&quot;,&quot;\&quot;role\&quot;: \&quot;user\&quot;&quot;:&quot;user prompt →&quot;,&quot;\&quot;role\&quot;: \&quot;assistant\&quot;&quot;:&quot;response →&quot;,
    &quot;\&quot;source\&quot;:&quot;:&quot;audit: prompt source&quot;,&quot;\&quot;snapshotAt\&quot;:&quot;:&quot;audit: prompt snapshot&quot;,
    &quot;\&quot;attachments\&quot;:&quot;:&quot;files changed&quot;,&quot;\&quot;change\&quot;:&quot;:&quot;add / mod / del&quot;,&quot;\&quot;commitMsg\&quot;:&quot;:&quot;commit message&quot;
  };
  return jsonFor(obj,map);
}

/* produce syntax-highlighted, line-mapped JSON */
function jsonFor(obj,map){
  const raw=JSON.stringify(obj,null,2);
  return raw.split('\n').map(line=>{
    let mapLabel='';
    for(const key in map){ if(line.includes(key)){ mapLabel=map[key]; break; } }
    // highlight
    let h=esc(line);
    // role values special
    h=h.replace(/&quot;(role)&quot;:\s*&quot;(system|user|assistant)&quot;/,'&quot;<span class=&quot;jk&quot;>$1</span>&quot;: &quot;<span class=&quot;jrole&quot;>$2</span>&quot;');
    // keys
    h=h.replace(/&quot;([^&quot;]+)&quot;:/g,(m,k)=> m.includes('jk')?m:`&quot;<span class=&quot;jk&quot;>${k}</span>&quot;:`);
    // string values (avoid double)
    h=h.replace(/:\s*&quot;([^&quot;]*)&quot;/g,(m,v)=> m.includes('jrole')?m:`: &quot;<span class=&quot;js&quot;>${v}</span>&quot;`);
    // numbers
    h=h.replace(/:\s*(-?\d+)(,?)$/,': <span class=&quot;jn&quot;>$1</span>$2');
    // bool/null
    h=h.replace(/:\s*(true|false|null)(,?)$/,': <span class=&quot;jb&quot;>$1</span>$2');
    return `<span class=&quot;jline&quot;${mapLabel?` data-map=&quot;${attr(mapLabel)}&quot;`:''}>${h||'&amp;nbsp;'}</span>`;
  }).join('\n');
}
function selectFile(key,el){
  document.querySelectorAll('#tree .row').forEach(r=>r.classList.remove('sel'));
  if(el)el.classList.add('sel');
  const names={task:'task.json',research:'01-research.json',planning:'02-planning.json',spec:'03-spec.json',build:'04-build.json',verify:'05-verify.json'};
  const st=STAGES.find(s=>s.stage===key);
  $('.jsonhdr .fn').innerHTML=`<span class=&quot;path&quot;>.bridza/tasks/506…/${key==='task'?'':'stages/'}</span><b>${names[key]}</b>`;
  $('.jsonhdr .badge').textContent = key==='task' ? 'task-level' : `${st.status}${st.runs.length>1?` · ${st.runs.length} runs`:' · 1 run'}`;
  $('#json').innerHTML=buildJSON(key);
}
function renderJSON(){ $('#json').innerHTML=buildJSON('build'); }

/* ---------- view toggle ---------- */
function setView(v){
  const d=v==='display';
  $('#view-display').classList.toggle('hide',!d);
  $('#view-storage').classList.toggle('hide',d);
  $('#tDisplay').classList.toggle('on',d);

}

let toastT;
function showToast(){
  const t=$('#toast'); t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1400);
}

renderRail(); renderThread(); initScrollSpy();

<script>
  (function(){
    var chips=[].slice.call(document.querySelectorAll('.chip'));
    var frames=[].slice.call(document.querySelectorAll('.frame'));
    function show(k){
      chips.forEach(function(c){c.classList.toggle('on',c.dataset.k===k)});
      frames.forEach(function(f){f.classList.toggle('on',f.dataset.k===k)});
    }
    chips.forEach(function(c){c.addEventListener('click',function(){show(c.dataset.k)})});
    document.addEventListener('keydown',function(e){
      if(/input|textarea/i.test((e.target.tagName||'')))return;
      var n=e.key==='0'?10:parseInt(e.key,10);
      if(n>=1&&n<=chips.length) show(chips[n-1].dataset.k);
    });
    if(chips[0]) show(chips[0].dataset.k);
  })();
</script>
