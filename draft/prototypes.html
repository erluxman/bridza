  .fld .fh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0c1017;
    border-bottom:1px solid var(--bd);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--dim);font-weight:700}
  .fld .fh .sha2{margin-left:auto;font-family:var(--mono);font-size:10px;color:#7d8aa0;text-transform:none;letter-spacing:0}
  .fld .fh .editlnk{font-size:10px;color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;background:none;border:none;padding:0}
  .fld .fh .sha2+.editlnk{margin-left:10px}
  .fld .fh .editlnk.solo{margin-left:auto}
  .fld .fh .editlnk:hover{text-decoration:underline}
  .fld .fh .cancl{font-size:10px;color:var(--dim2);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;background:none;border:none;padding:0;margin-left:8px;display:none}
  .fld.editing .cancl{display:inline}
  .fld .fh .edited{margin-left:8px;font-size:9px;color:var(--run);text-transform:none;letter-spacing:.2px;font-weight:700;display:none}
  .fld.dirty .edited{display:inline}
  .fbody{padding:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.55;color:#c7d2e0;white-space:pre-wrap;word-break:break-word;min-height:20px}
  .fbody[contenteditable=&quot;true&quot;]{outline:1px solid var(--accent);background:#0a1220;border-radius:5px}
  .fbody.usr{color:#e6ecf5}
  .respbox{background:#0a0e15;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
  .respbox .rh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--dim)}
  .respbox .rh .ref{margin-left:auto;font-family:var(--mono);font-size:10px;color:#9db4ff;background:#131b2b;padding:2px 7px;border-radius:5px;border:1px solid #24406e}
  .respbox .rh .spill{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--run)}
  .respbody{padding:13px 15px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;color:#cdd6e4;max-height:340px;overflow:auto}
  .respbody.err{color:#ffb4b6}

  /* summary field emphasised */
  .sumfld{margin-bottom:14px;background:#0c1420;border:1px solid #1c3350;border-radius:9px;overflow:hidden}
  .sumfld .fh{background:#0c1420;border-bottom:1px solid #1c3350;color:#9db4ff}
  .sumfld .fbody{color:#dbe6ff;font-family:var(--sans);font-size:13px;line-height:1.5}

  /* meta facts grid */
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px;background:var(--bd);
    border:1px solid var(--bd);border-radius:9px;overflow:hidden}
  .fact{background:var(--panel2);padding:9px 12px}
  .fact .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);margin-bottom:3px}
  .fact .v{font-family:var(--mono);font-size:12px;color:var(--txt);word-break:break-word}
  .fact .v.hi{color:#9db4ff}

  /* files table in drawer */
  .ftab{width:100%;border-collapse:collapse;min-width:unset}
  .ftab td{padding:6px 10px;border-bottom:1px solid #141b26;font-family:var(--mono);font-size:12px;white-space:nowrap}
  .ftab tr:last-child td{border-bottom:none}
  .chg{display:inline-flex;align-items:center;gap:6px;width:74px}
  .chg .tag{width:18px;text-align:center;border-radius:4px;font-weight:800;font-size:10px}
  .chg.added .tag{color:#7ee787;background:#12331d} .chg.added{color:#7ee787}
  .chg.modified .tag{color:#e3b341;background:#33280c} .chg.modified{color:#e3b341}
  .chg.deleted .tag{color:#ff8f92;background:#3a1315} .chg.deleted{color:#ff8f92}
  .lines{color:var(--dim);font-size:11px}
  .lines .p{color:#7ee787}.lines .m{color:#ff8f92}
  .fpath{color:#d6deea}

  /* audit trail */
  .audit{position:relative;padding-left:6px}
  .aevent{display:flex;gap:11px;padding:7px 0;position:relative}
  .aevent .adot{width:9px;height:9px;border-radius:50%;background:var(--dim2);margin-top:3px;flex-shrink:0;z-index:1}
  .aevent.started .adot{background:var(--run)} .aevent.done .adot{background:var(--done)}
  .aevent.failed .adot{background:var(--fail)} .aevent.rerun .adot{background:var(--accent)}
  .aevent.edited .adot{background:#c792ea}
  .aevent:not(:last-child)::before{content:&quot;&quot;;position:absolute;left:4px;top:14px;bottom:-7px;width:1px;background:var(--bd2)}
  .aev-body{font-size:12px}
  .aev-ev{font-weight:600;text-transform:capitalize}
  .aev-meta{color:var(--dim2);font-size:11px;font-family:var(--mono);margin-top:1px}
  .aev-meta b{color:#9db4ff}

  /* ============ STORAGE ============ */
  .storewrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
  .storehead{margin-bottom:18px}
  .storehead h2{margin:0 0 5px;font-size:17px}
  .storehead p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.5;max-width:640px}

    color:#9fe6bd;font-size:12.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
  .killer svg{flex-shrink:0;margin-top:1px}
  .killer b{color:#c8f7dc}
  .storecols{display:grid;grid-template-columns:300px 1fr;gap:18px}
  @media(max-width:860px){.storecols{grid-template-columns:1fr}}
  .card{background:var(--panel2);border:1px solid var(--bd);border-radius:11px;overflow:hidden}
  .card .ch{padding:10px 14px;border-bottom:1px solid var(--bd);font-size:11px;text-transform:uppercase;

  .tree{padding:12px 10px;font-family:var(--mono);font-size:12px;line-height:1.85;overflow-x:auto}

  .tree .cmt{color:var(--dim2);font-style:italic}
  .tree .rid2{color:#9fe6bd}

  .jsonwrap{position:relative}
  .jsonhead{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd);background:#0c1017;gap:9px;flex-wrap:wrap}
  .jsonhead .fname{font-family:var(--mono);font-size:12px;color:#9db4ff}
  .jsonhead .badge{font-size:10px;color:var(--dim2);border:1px solid var(--bd2);border-radius:5px;padding:1px 6px}
  .jsonhead .rl{margin-left:auto;display:flex;gap:2px;background:#0a0e15;border:1px solid var(--bd);border-radius:7px;padding:2px}
  .jsonhead .rl button{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:5px;color:var(--dim)}
  .jsonhead .rl button.on{background:var(--accent2);color:#fff}
  .jsonhead .rl button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .jsonbody{padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.7;overflow:auto;max-height:520px}
  .jl{display:block;padding:2px 4px;border-radius:4px}
  .jl.raw{white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
  .jl.pretty{white-space:pre;margin-bottom:6px}
  .k{color:#79b8ff}.s{color:#9ecbff}.n{color:#f0b429}.b{color:#c792ea}.nul{color:#f2555a}.pun{color:#5f6c7e}
  .jl.hl-fail{background:#2a0f10}
  .jl.hl-done{background:#0d1f16}
  .jl.hl-run{background:#2a2208}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:20px;height:11px;border-radius:3px;display:inline-block}

  .empty{padding:40px;text-align:center;color:var(--dim2)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#1e2733;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2a3542}

  .toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:#12233d;
    border:1px solid #24406e;color:#dbe6ff;font-size:12px;padding:8px 15px;border-radius:8px;
    box-shadow:0 8px 24px #0009;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;font-weight:600}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  if(k===&quot;order&quot;){return r.order*100+r.run_idx}
  return r[k];
}
function setSort(k){
  if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=1}
  document.querySelectorAll(&quot;thead th&quot;).forEach(th=>{
    th.classList.toggle(&quot;sorted&quot;,th.dataset.k===k);
    const a=th.querySelector(&quot;.arw&quot;);if(a&amp;&amp;th.dataset.k===k)a.textContent=state.sortDir>0?&quot;▲&quot;:&quot;▼&quot;;
  });
  render();
}

/* ---------------- render grid ---------------- */
function filesMini(r){
  if(!r.files.length)return `<span class=&quot;fnone&quot;>— none —</span>`;
  const c={added:0,modified:0,deleted:0};r.files.forEach(f=>c[f.change]++);
  let out=`<span class=&quot;files-mini&quot;>`;
  out+=`<span style=&quot;color:var(--dim)&quot;>${r.files.length}</span>`;
  if(c.added)out+=`<span class=&quot;fpill a&quot;>+${c.added}</span>`;
  if(c.modified)out+=`<span class=&quot;fpill m&quot;>~${c.modified}</span>`;
  if(c.deleted)out+=`<span class=&quot;fpill d&quot;>−${c.deleted}</span>`;
  return out+`</span>`;
}
function render(){
  state.q=document.getElementById(&quot;q&quot;).value.trim().toLowerCase();
  let rows=RUNS.slice();
  if(!state.showSup)rows=rows.filter(r=>!r.superseded_by);
  if(state.filters.size)rows=rows.filter(r=>state.filters.has(r.status));
  if(state.q){
    rows=rows.filter(r=>{
      const hay=[r.stage,r.tool,r.model,r.summary,r.run_id,r.commit,r.user_prompt,r.system_prompt,...r.files.map(f=>f.path)].join(&quot; &quot;).toLowerCase();
      return hay.includes(state.q);
    });
  }
  rows.sort((a,b)=>{const va=sortVal(a,state.sortKey),vb=sortVal(b,state.sortKey);
    if(va<vb)return -1*state.sortDir;if(va>vb)return 1*state.sortDir;return 0});

  const tb=document.getElementById(&quot;tbody&quot;);tb.innerHTML=&quot;&quot;;
  document.getElementById(&quot;emptyState&quot;).style.display=rows.length?&quot;none&quot;:&quot;block&quot;;

  rows.forEach(r=>{
    const m=STATUS_META[r.status];
    const tr=document.createElement(&quot;tr&quot;);
    tr.className=&quot;rrow&quot;+(state.open===r.run_id?&quot; sel&quot;:&quot;&quot;)+(r.superseded_by?&quot; superseded&quot;:&quot;&quot;);
    tr.onclick=()=>toggleRow(r.run_id);
    // discoverability: a re-run row shows it healed a prior failure without needing the superseded toggle
    const rerunNote=r.rerun_of?`<span class=&quot;reruntag&quot; title=&quot;re-run after ${esc(r.rerun_of)} failed&quot;>RE-RUN</span>`:&quot;&quot;;
    const supNote=r.superseded_by?`<span class=&quot;healtag&quot; title=&quot;replaced by ${esc(r.superseded_by)}&quot;>SUPERSEDED</span>`:&quot;&quot;;
    tr.innerHTML=`
      <td><span class=&quot;expander&quot;>▶</span></td>
      <td><span class=&quot;stat ${m.c}&quot;><span class=&quot;led&quot;></span>${m.lbl}${r.exit_code!=null?` <span style=&quot;color:var(--dim2);font-family:var(--mono);font-size:10px;font-weight:400&quot;>·${r.exit_code}</span>`:&quot;&quot;}</span></td>
      <td><div class=&quot;stagecell&quot;><span class=&quot;ordbadge&quot;>${r.order}</span><span class=&quot;stagename&quot;>${esc(r.stage)}</span>${r.run_idx>1?`<span class=&quot;runidx&quot;>·run ${r.run_idx}</span>`:&quot;&quot;}${rerunNote}${supNote}</div></td>
      <td><span class=&quot;tool&quot;>${esc(r.tool)} <span class=&quot;mdl&quot;>/ ${esc(r.model)}</span></span></td>
      <td><span class=&quot;dur&quot;>${fmtDur(r.duration_s)}${r.status===&quot;running&quot;?' <span style=&quot;color:var(--run)&quot;>▸</span>':&quot;&quot;}</span></td>
      <td>${filesMini(r)}</td>
      <td>${r.commit?`<span class=&quot;sha&quot;>${esc(r.commit)}</span>`:`<span class=&quot;sha none&quot;>—</span>`}</td>
      <td class=&quot;audit-cell&quot;>${r.actor?`<span class=&quot;who&quot;>${esc(r.actor)}</span> · ${esc(fmtWhen(r.started_at))}`:&quot;—&quot;}</td>
      <td class=&quot;summary&quot;><span class=&quot;st&quot;></span>${esc(r.summary)}</td>`;
    tb.appendChild(tr);

    if(state.open===r.run_id){
      const dr=document.createElement(&quot;tr&quot;);dr.className=&quot;drawer-row&quot;;
      const td=document.createElement(&quot;td&quot;);td.colSpan=9;
      td.appendChild(buildDrawer(r));
      dr.appendChild(td);tb.appendChild(dr);
    }
  });
  syncFlowSel();
}
function syncFlowSel(){
  const nodes=document.querySelectorAll(&quot;#flowrail .node&quot;);
  nodes.forEach(n=>n.classList.remove(&quot;sel&quot;));
  const openRun=state.open?byId(state.open):null;
  if(openRun){
    const idx=liveOrders().indexOf(openRun.order);
    if(idx>=0&amp;&amp;nodes[idx])nodes[idx].classList.add(&quot;sel&quot;);
  }
}
function toggleRow(id){state.open=state.open===id?null:id;if(state.open&amp;&amp;!state.tab[id])state.tab[id]=&quot;prompts&quot;;render();
  if(state.open){setTimeout(()=>{document.querySelector(&quot;tr.sel&quot;)?.scrollIntoView({block:&quot;nearest&quot;,behavior:&quot;smooth&quot;})},60)}}
function openRun(id){
  let r=byId(id);
  if(r&amp;&amp;r.superseded_by&amp;&amp;!state.showSup)id=r.superseded_by;   // jump to the live run if the superseded one is hidden
  state.open=id;if(!state.tab[id])state.tab[id]=&quot;prompts&quot;;render();
  setTimeout(()=>document.querySelector(&quot;tr.sel&quot;)?.scrollIntoView({block:&quot;center&quot;,behavior:&quot;smooth&quot;}),60);
}

/* ---------------- drawer ---------------- */
function buildDrawer(r){
  const wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;drawer&quot;;
  const m=STATUS_META[r.status];
  const canReplay=r.status===&quot;failed&quot;||r.status===&quot;done&quot;;
  const healed=REPLACED_BY[r.run_id];
  wrap.innerHTML=`
    <div class=&quot;dwrap&quot;>
      <div class=&quot;dhdr&quot;>
        <div class=&quot;dtitle&quot;>
          <span class=&quot;stat ${m.c}&quot;><span class=&quot;led&quot;></span></span>

          ${r.superseded_by?`<span class=&quot;healtag&quot; title=&quot;superseded by a later run&quot;>SUPERSEDED → ${esc(r.superseded_by)}</span>`:&quot;&quot;}
          ${healed?`<span class=&quot;healtag&quot; title=&quot;this run replaced a failed one&quot; style=&quot;color:#31c48d;background:#0d1f16;border-color:#1c3a26&quot;>HEALED ${esc(healed)}</span>`:&quot;&quot;}
        </div>
        <div class=&quot;dmeta&quot;>

          <button class=&quot;dbtn&quot; data-copy onclick=&quot;event.stopPropagation();copyRow(event,'${r.run_id}')&quot;>⧉ Copy JSON line</button>
          <button class=&quot;dbtn danger&quot; data-close>✕ Close</button>
        </div>
      </div>
      <div class=&quot;tabs&quot; role=&quot;tablist&quot;>
        <button class=&quot;tab ${tabOn(r,'prompts')}&quot; onclick=&quot;event.stopPropagation();setTab('${r.run_id}','prompts')&quot;>Prompts</button>
        <button class=&quot;tab ${tabOn(r,'response')}&quot; onclick=&quot;event.stopPropagation();setTab('${r.run_id}','response')&quot;>Response</button>

        <button class=&quot;tab ${tabOn(r,'meta')}&quot; onclick=&quot;event.stopPropagation();setTab('${r.run_id}','meta')&quot;>Meta</button>
        <button class=&quot;tab ${tabOn(r,'audit')}&quot; onclick=&quot;event.stopPropagation();setTab('${r.run_id}','audit')&quot;>Audit <span class=&quot;cnt&quot;>${r.audit.length}</span></button>
      </div>

  wrap.querySelector(&quot;[data-close]&quot;).onclick=(e)=>{e.stopPropagation();toggleRow(r.run_id)};

}
function tabOn(r,t){return (state.tab[r.run_id]||&quot;prompts&quot;)===t?&quot;on&quot;:&quot;&quot;}
function paneOn(r,t){return (state.tab[r.run_id]||&quot;prompts&quot;)===t?&quot;on&quot;:&quot;&quot;}
const TAB_NAMES=[&quot;prompts&quot;,&quot;response&quot;,&quot;files&quot;,&quot;meta&quot;,&quot;audit&quot;];
/* switch tab by toggling classes only, so an in-progress edit is never destroyed by a re-render */
function setTab(id,t){
  state.tab[id]=t;
  const drawer=document.querySelector(&quot;tr.drawer-row .drawer&quot;);
  if(!drawer){render();return}
  drawer.querySelectorAll(&quot;.tab&quot;).forEach((b,i)=>b.classList.toggle(&quot;on&quot;,TAB_NAMES[i]===t));
  drawer.querySelectorAll(&quot;.tabpane&quot;).forEach(p=>p.classList.toggle(&quot;on&quot;,p.dataset.pane===t));
}

function panePrompts(r){

    <div class=&quot;fld sumfld&quot; data-field=&quot;summary&quot;>
      <div class=&quot;fh&quot;>Response summary
        <button class=&quot;editlnk solo&quot; onclick=&quot;event.stopPropagation();editFld(event,'${r.run_id}','summary')&quot;>✎ edit</button>

    </div>
    <div class=&quot;grid2&quot;>
      <div class=&quot;fld&quot; data-field=&quot;system_prompt&quot;>
        <div class=&quot;fh&quot;>System prompt <span class=&quot;sha2&quot;>${esc(r.system_prompt_sha)}</span>
          <button class=&quot;editlnk&quot; onclick=&quot;event.stopPropagation();editFld(event,'${r.run_id}','system_prompt')&quot;>✎ edit</button>
          <button class=&quot;cancl&quot; onclick=&quot;event.stopPropagation();cancelFld(event,'system_prompt')&quot;>cancel</button>
          <span class=&quot;edited&quot;>edited</span>
        </div>
        <div class=&quot;fbody&quot;>${esc(r.system_prompt)}</div>
      </div>
      <div class=&quot;fld&quot; data-field=&quot;user_prompt&quot;>

          <button class=&quot;cancl&quot; onclick=&quot;event.stopPropagation();cancelFld(event,'user_prompt')&quot;>cancel</button>

        <div class=&quot;fbody usr&quot;>${r.user_prompt?esc(r.user_prompt):'<span style=&quot;color:var(--dim2);font-style:italic&quot;>— none entered yet (stage idle) —</span>'}</div>

  </div>`;
}
function paneResponse(r){
  const spilled=r.response==null&amp;&amp;r.response_ref;
  const body=unspill(r);
  const isErr=r.status===&quot;failed&quot;;
  let head;
  if(r.status===&quot;idle&quot;){head=`<span>No response yet — stage is idle.</span>`}
  else if(spilled){head=`<span>agent output</span><span class=&quot;ref&quot; title=&quot;large response spilled to disk&quot;>↪ ${esc(r.response_ref)}</span>`}
  else{head=`<span>agent output</span><span class=&quot;spill&quot;>inline · small</span>`}
  return `<div class=&quot;tabpane ${paneOn(r,'response')}&quot; data-pane=&quot;response&quot;>
    <div class=&quot;respbox&quot;>
      <div class=&quot;rh&quot;>${head}</div>
      <div class=&quot;respbody ${isErr?'err':''}&quot;>${body?esc(body):'<span style=&quot;color:var(--dim2);font-style:italic&quot;>— empty —</span>'}${r.status===&quot;running&quot;?'<span style=&quot;color:var(--run)&quot;>▮</span>':&quot;&quot;}</div>
    </div>
    ${spilled?`<div style=&quot;margin-top:9px;font-size:11px;color:var(--dim2)&quot;>Response was large, so it lives at <code style=&quot;font-family:var(--mono);color:#9db4ff&quot;>${esc(r.response_ref)}</code> and is referenced from the row — the <code style=&quot;font-family:var(--mono);color:#9db4ff&quot;>.jsonl</code> line stays lean.</div>`:&quot;&quot;}
  </div>`;
}
function paneFiles(r){
  if(!r.files.length){
    return `<div class=&quot;tabpane ${paneOn(r,'files')}&quot; data-pane=&quot;files&quot;><div style=&quot;padding:22px;text-align:center;color:var(--dim2)&quot;>No files changed in this run${r.status===&quot;failed&quot;?&quot; — the agent aborted before writing.&quot;:&quot;.&quot;}</div></div>`;
  }
  const rows=r.files.map(f=>{
    const tag={added:&quot;A&quot;,modified:&quot;M&quot;,deleted:&quot;D&quot;}[f.change];
    const lines=esc(f.lines).replace(/\+(\d+)/g,'<span class=&quot;p&quot;>+$1</span>').replace(/−(\d+)/g,'<span class=&quot;m&quot;>−$1</span>');
    return `<tr><td><span class=&quot;chg ${f.change}&quot;><span class=&quot;tag&quot;>${tag}</span>${f.change}</span></td><td class=&quot;fpath&quot;>${esc(f.path)}</td><td class=&quot;lines&quot;>${lines}</td></tr>`;
  }).join(&quot;&quot;);
  return `<div class=&quot;tabpane ${paneOn(r,'files')}&quot; data-pane=&quot;files&quot;>
    <table class=&quot;ftab&quot;><tbody>${rows}</tbody></table>
    <div style=&quot;margin-top:10px;font-size:11px;color:var(--dim2)&quot;>${r.commit?`Committed as <span class=&quot;sha&quot; style=&quot;font-family:var(--mono)&quot;>${esc(r.commit)}</span> on <code style=&quot;font-family:var(--mono);color:#9db4ff&quot;>task/506-q3-microsite</code>.`:&quot;Not committed — no result sha for this run.&quot;}</div>
  </div>`;
}
function paneMeta(r){
  const facts=[
    [&quot;Run id&quot;,r.run_id,1],[&quot;Task&quot;,`#${r.task}`],[&quot;Stage · order&quot;,`${r.stage} · ${r.order}`],[&quot;Run index&quot;,`#${r.run_idx}`],
    [&quot;Status&quot;,STATUS_META[r.status].lbl],[&quot;Exit code&quot;,r.exit_code==null?&quot;—&quot;:r.exit_code],
    [&quot;Tool&quot;,r.tool],[&quot;Model&quot;,r.model,1],
    [&quot;Started&quot;,fmtDate(r.started_at)],[&quot;Finished&quot;,fmtDate(r.finished_at)],[&quot;Duration&quot;,fmtDur(r.duration_s)],
    [&quot;Result commit&quot;,r.commit||&quot;—&quot;,r.commit?1:0],
    [&quot;Actor&quot;,r.actor||&quot;—&quot;],[&quot;Trigger&quot;,r.trigger],
    [&quot;rerun_of&quot;,r.rerun_of||&quot;—&quot;,r.rerun_of?1:0],[&quot;superseded_by&quot;,r.superseded_by||&quot;—&quot;,r.superseded_by?1:0],
    [&quot;response_ref&quot;,r.response_ref||&quot;inline&quot;,r.response_ref?1:0],[&quot;sys prompt sha&quot;,r.system_prompt_sha,1],
  ];
  return `<div class=&quot;tabpane ${paneOn(r,'meta')}&quot; data-pane=&quot;meta&quot;>
    <div class=&quot;facts&quot;>${facts.map(f=>`<div class=&quot;fact&quot;><div class=&quot;k&quot;>${esc(f[0])}</div><div class=&quot;v ${f[2]?'hi':''}&quot;>${esc(f[1])}</div></div>`).join(&quot;&quot;)}</div>
  </div>`;
}
function paneAudit(r){
  if(!r.audit.length){
    return `<div class=&quot;tabpane ${paneOn(r,'audit')}&quot; data-pane=&quot;audit&quot;><div style=&quot;padding:22px;text-align:center;color:var(--dim2)&quot;>No audit events yet — this stage has never run.</div></div>`;
  }
  const evs=r.audit.map(a=>{
    let ev=a.ev,cls=a.ev,label,meta;
    if(ev===&quot;rerun_of&quot;){cls=&quot;rerun&quot;;label=&quot;Re-run of prior run&quot;;meta=`ref <b>${esc(a.ref)}</b>`}
    else if(ev===&quot;started&quot;){label=&quot;Started&quot;;meta=`by <b>${esc(a.by)}</b>`}
    else if(ev===&quot;done&quot;){label=&quot;Completed&quot;;meta=`by <b>${esc(a.by)}</b>`}
    else if(ev===&quot;failed&quot;){label=&quot;Failed&quot;;meta=`error <b style=&quot;color:#ff8f92&quot;>${esc(a.err)}</b>`}
    else if(ev===&quot;edited&quot;){cls=&quot;edited&quot;;label=&quot;Field edited&quot;;meta=`${esc(a.field)} · by <b>${esc(a.by)}</b>`}
    else{label=ev;meta=&quot;&quot;}
    return `<div class=&quot;aevent ${cls}&quot;><div class=&quot;adot&quot;></div><div class=&quot;aev-body&quot;><div class=&quot;aev-ev&quot;>${label}</div><div class=&quot;aev-meta&quot;>${fmtDate(a.at)} · ${meta}</div></div></div>`;
  }).join(&quot;&quot;);
  return `<div class=&quot;tabpane ${paneOn(r,'audit')}&quot; data-pane=&quot;audit&quot;><div class=&quot;audit&quot;>${evs}</div>
    <div style=&quot;margin-top:12px;font-size:11px;color:var(--dim2)&quot;>Who / when / re-run lineage, reconstructed entirely from the <b style=&quot;color:#9db4ff&quot;>audit[]</b> array on this one <code style=&quot;font-family:var(--mono);color:#9db4ff&quot;>.jsonl</code> line.</div>
  </div>`;
}

/* ---------------- edit affordance (persists back into RUNS) ---------------- */
function fldEl(fieldName){
  const drawer=document.querySelector(&quot;tr.drawer-row .drawer&quot;);
  if(!drawer)return null;
  return drawer.querySelector(`.fld[data-field=&quot;${fieldName}&quot;]`);
}
function editFld(e,id,field){
  e.stopPropagation();
  const fld=fldEl(field);if(!fld)return;
  const body=fld.querySelector(&quot;.fbody&quot;);
  const btn=fld.querySelector(&quot;.editlnk&quot;);
  if(fld.classList.contains(&quot;editing&quot;)){
    // SAVE — write edited text back into the run object, log audit, resync dependent views
    const val=body.innerText.replace(/ /g,&quot; &quot;).trim();
    const r=byId(id);
    r[field]=val;
    body.setAttribute(&quot;contenteditable&quot;,&quot;false&quot;);
    fld.classList.remove(&quot;editing&quot;);
    fld.classList.add(&quot;dirty&quot;);
    btn.textContent=&quot;✎ edit&quot;;
    r.audit.push({at:new Date().toISOString().slice(0,19)+&quot;Z&quot;,ev:&quot;edited&quot;,field:field,by:&quot;maya&quot;});
    toast(&quot;Saved to stages.jsonl · &quot;+field);
    render();                       // reflects new summary in grid + refreshed audit count
    setTab(id,state.tab[id]||&quot;prompts&quot;);
    renderJson();                   // storage view stays in sync with the persisted edit
  }else{
    fld.classList.add(&quot;editing&quot;);
    body.setAttribute(&quot;contenteditable&quot;,&quot;true&quot;);
    body._orig=body.innerText;
    body.focus();
    const sel=window.getSelection(),range=document.createRange();
    range.selectNodeContents(body);range.collapse(false);sel.removeAllRanges();sel.addRange(range);
    btn.textContent=&quot;✔ save&quot;;
  }
}
function cancelFld(e,field){
  e.stopPropagation();
  const fld=fldEl(field);if(!fld)return;
  const body=fld.querySelector(&quot;.fbody&quot;);
  const btn=fld.querySelector(&quot;.editlnk&quot;);
  if(body._orig!=null)body.innerText=body._orig;
  body.setAttribute(&quot;contenteditable&quot;,&quot;false&quot;);
  fld.classList.remove(&quot;editing&quot;);
  btn.textContent=&quot;✎ edit&quot;;
}
function copyRow(e,id){
  e.stopPropagation();
  const r=byId(id);const {__spilled,...clean}=r;
  const line=JSON.stringify(clean);
  const btn=e.currentTarget;
  const done=()=>{const t=btn.textContent;btn.textContent=&quot;✓ copied&quot;;toast(&quot;JSON line copied&quot;);setTimeout(()=>btn.textContent=t,1200)};
  if(navigator.clipboard&amp;&amp;navigator.clipboard.writeText){navigator.clipboard.writeText(line).then(done).catch(fallback)}
  else fallback();
  function fallback(){
    const ta=document.createElement(&quot;textarea&quot;);ta.value=line;ta.style.position=&quot;fixed&quot;;ta.style.opacity=&quot;0&quot;;
    document.body.appendChild(ta);ta.select();try{document.execCommand(&quot;copy&quot;)}catch(_){}
    document.body.removeChild(ta);done();
  }
}

/* ---------------- view toggle ---------------- */
function setView(v){
  document.getElementById(&quot;view-display&quot;).classList.toggle(&quot;on&quot;,v===&quot;display&quot;);
  document.getElementById(&quot;view-storage&quot;).classList.toggle(&quot;on&quot;,v===&quot;storage&quot;);
  document.getElementById(&quot;vb-display&quot;).classList.toggle(&quot;on&quot;,v===&quot;display&quot;);
  document.getElementById(&quot;vb-storage&quot;).classList.toggle(&quot;on&quot;,v===&quot;storage&quot;);
  if(v===&quot;storage&quot;)renderJson();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const fmtTime = iso => iso ? new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : null;
const clock = iso => iso ? new Date(iso).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : null;
const dur = s => s==null ? &quot;—&quot; : (s<60 ? s+&quot;s&quot; : Math.floor(s/60)+&quot;m &quot;+(s%60)+&quot;s&quot;);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);}

/* ---------- build derived commit list (the graph) ---------- */
/* walk every run's {promptCommit,resultCommit} across stages in flow order */
function buildGraph(){
  const rows=[];
  STAGES.forEach(st=>{
    st.runs.forEach(r=>{
      rows.push({type:&quot;prompt&quot;, stage:st, run:r, commit:r.promptCommit});
      rows.push({type:&quot;result&quot;, stage:st, run:r, commit:r.resultCommit, status:r.status});
    });
  });
  return rows;
}

/* ---------- stat strip ---------- */
function renderStats(){
  const runs = STAGES.flatMap(s=>s.runs);
  const commitCount = runs.reduce((n,r)=>n+1+(r.resultCommit?1:0),0);
  const done = STAGES.filter(s=>s.status==='done').length;
  const data=[
    {k:&quot;Stages&quot;,v:STAGES.length},
    {k:&quot;Runs&quot;,v:runs.length},
    {k:&quot;Commits&quot;,v:commitCount},
    {k:&quot;Done&quot;,v:done+&quot;/&quot;+STAGES.length},
    {k:&quot;Model&quot;,v:&quot;opus-4-8&quot;},
    {k:&quot;Head&quot;,v:TASK.graphHead}
  ];
  const strip=$('#statStrip'); strip.innerHTML=&quot;&quot;;
  data.forEach(d=>{const s=el('div','stat'); s.innerHTML=`<div class=&quot;k&quot;>${d.k}</div><div class=&quot;v&quot;>${d.v}</div>`; strip.appendChild(s);});
  $('#headSub').textContent = &quot;HEAD → &quot;+TASK.graphHead+&quot; (build/prompt)&quot;;
}

/* ---------- render graph ---------- */
let SELECTED = null; // {stage, run, type}
function renderGraph(){
  const g=$('#graph'); g.innerHTML=&quot;&quot;;
  const rows = buildGraph();
  let curStage = null;
  rows.forEach((row,i)=>{
    if(row.stage!==curStage){
      curStage=row.stage;
      const sep=el('div','stage-sep');
      sep.innerHTML = `<span class=&quot;stagetag&quot;>${row.stage.ordinal}. ${row.stage.stage}</span>
        <span class=&quot;sbadge ${row.stage.status}&quot;>${row.stage.status}</span><span class=&quot;ln&quot;></span>`;
      g.appendChild(sep);
    }
    g.appendChild(commitRow(row,i,rows.length));
  });
  // idle stage with zero runs → show a clickable ghost row so its defined prompt/goal stay surfaceable
  STAGES.filter(s=>s.runs.length===0).forEach(idle=>{
    const sep=el('div','stage-sep');
    sep.innerHTML=`<span class=&quot;stagetag&quot; style=&quot;color:var(--idle)&quot;>${idle.ordinal}. ${idle.stage}</span>
      <span class=&quot;sbadge idle&quot;>idle</span><span class=&quot;ln&quot;></span>`;
    g.appendChild(sep);
    g.appendChild(idleRow(idle));
  });
}

function commitRow(row,i,total){
  const c = row.commit;
  const wrap=el('div','commit'+(i===0?' first':'')+(i===total-1?' last':''));
  const isNull = (row.type==='result' &amp;&amp; c===null);
  wrap.dataset.stage = row.stage.stage;
  wrap.dataset.run = row.run.run;
  wrap.dataset.type = row.type;

  let nodeCls='node '+row.type;
  if(row.type==='result') nodeCls += ' '+ (isNull ? 'pending' : row.status);

  const shaTxt = isNull ? '—' : c.abbrev;
  const kindTxt = row.type==='prompt' ? 'prompt' : 'result';
  const subject = isNull
    ? 'bridza('+row.stage.stage+'): result · pending…'
    : c.subject;
  const when = isNull ? 'awaiting tool exit' : clock(c.committedAt);

  wrap.innerHTML = `
    <div class=&quot;rail&quot;><div class=&quot;${nodeCls}&quot;></div></div>
    <div class=&quot;cbody&quot;>
      <div class=&quot;cline&quot;>
        <span class=&quot;kind ${row.type}&quot;>${kindTxt}</span>
        <span class=&quot;sha&quot;>${shaTxt}</span>
        <span class=&quot;runtag&quot;>run ${row.run.run}</span>
        ${row.run.audit &amp;&amp; row.run.audit.supersedes ? '<span class=&quot;runtag&quot; style=&quot;color:var(--run)&quot;>rerun ▸ supersedes #'+row.run.audit.supersedes+'</span>':''}
      </div>
      <p class=&quot;csub&quot;>${subject}</p>
      <div class=&quot;cmeta&quot;>
        <span><b>${row.run.tool}</b> · ${row.run.model}</span>
        <span>${when}</span>
      </div>
    </div>`;
  wrap.addEventListener('click',()=>selectRun(row.stage.stage, row.run.run, row.type, wrap));
  return wrap;
}

function idleRow(stage){
  const wrap=el('div','commit last');
  wrap.dataset.stage = stage.stage;
  wrap.dataset.type = 'idle';
  wrap.innerHTML = `
    <div class=&quot;rail&quot;><div class=&quot;node idle&quot;></div></div>
    <div class=&quot;cbody&quot;>
      <div class=&quot;cline&quot;>
        <span class=&quot;kind idle&quot;>idle</span>
        <span class=&quot;sha&quot;>—</span>
        <span class=&quot;runtag&quot;>0 runs</span>
      </div>
      <p class=&quot;csub&quot;>bridza(${stage.stage}): no commits yet — defined but never run</p>
      <div class=&quot;cmeta&quot;><span>click to inspect its defined prompt &amp;amp; goal</span></div>
    </div>`;
  wrap.addEventListener('click',()=>selectIdle(stage.stage, wrap));
  return wrap;
}

/* ---------- inspector: idle (never-run) stage ---------- */

  document.querySelectorAll('.commit.sel').forEach(e=>e.classList.remove('sel'));

  $('#inspEmpty').style.display='none';
  const box=$('#inspContent'); box.style.display='block';

}

function selectRun(stageName, runNo, type, wrapEl){
  document.querySelectorAll('.commit.sel').forEach(e=>e.classList.remove('sel'));
  if(wrapEl) wrapEl.classList.add('sel');
  const stage = STAGES.find(s=>s.stage===stageName);
  const run = stage.runs.find(r=>r.run===runNo);
  SELECTED = {stage, run, type};
  $('#inspEmpty').style.display='none';
  const box=$('#inspContent'); box.style.display='block';
  box.innerHTML = inspectorHTML(stage, run);
  box.scrollTop=0;
}

function statusColor(s){return {done:'var(--done)',failed:'var(--fail)',running:'var(--run)',idle:'var(--idle)'}[s]||'var(--ink-3)';}
function escapeHTML(s){return (s+'').replace(/[&amp;<>]/g,m=>({'&amp;':'&amp;amp;','<':'&amp;lt;','>':'&amp;gt;'}[m]));}

/* ---------- edit affordance ---------- */
function toggleEdit(btn){
  const field = btn.closest('.field').querySelector('[data-field]');
  const editing = field.getAttribute('contenteditable')==='true';
  if(editing){
    field.setAttribute('contenteditable','false');
    // persist edit back into data model (editable + auditable)
    const key = field.dataset.field;
    const {stage,run}=SELECTED;
    if(key==='systemPrompt'){
      const target = run ? run.systemPrompt : stage.systemPrompt;
      if(target) target.text=field.innerText;
    } else if(run){
      run[key]=field.innerText;
      if(key==='responseSummary') renderGraph(); // keep inline summaries in sync
    }
    btn.innerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M11 4H4v16h16v-7&quot;/><path d=&quot;M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z&quot;/></svg>Edit';
    toast('Saved — audit: erluxman edited '+key);
  }else{
    field.setAttribute('contenteditable','true'); field.focus();
    btn.innerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M20 6L9 17l-5-5&quot;/></svg>Save';
  }
}

function replay(stageName, runNo){

      ? '<svg class=&quot;ic folder&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z&quot;/></svg>'
      : '<svg class=&quot;ic json&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 2v6h6&quot;/></svg>';
    row.innerHTML = indent+icon+`<span class=&quot;nm&quot;>${n.name}</span>`
      + (n.tag?`<span class=&quot;tag ${n.tag.cls}&quot;>${n.tag.t}</span>`:'')
      + (n.cm?`<span class=&quot;cm&quot;>${n.cm}</span>`:'');
    if(n.type==='file'){ row.addEventListener('click',()=>selectFile(n.key,row)); }
    t.appendChild(row);
  });
}

.srcrow .k{font-size:11px;font-family:var(--mono);color:var(--accent);margin-bottom:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.prompt{font-size:13px;line-height:1.6;white-space:pre-wrap;color:#dbe4f2}
.prompt[contenteditable=true]{outline:none;border-radius:5px;padding:2px 4px;margin:-2px -4px}
.prompt[contenteditable=true]:focus{background:#0d1220;box-shadow:0 0 0 1px #3a4d80}
.origin{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);margin-top:6px;word-break:break-all}
.origin b{color:var(--dim);font-weight:600}
.attach{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--accent);background:#0d1526;border:1px solid var(--line2);padding:2px 7px;border-radius:5px;margin-top:6px}

/* executions */
.execs{padding:4px 16px 14px}
.exectabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.exectab{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--dim);display:flex;align-items:center;gap:6px}
.exectab.on{background:var(--panel2);color:var(--ink);border-color:#3a4d80}
.exectab .mk{font-size:11px}
.exectab .ok{color:var(--green)}
.exectab .no{color:var(--red)}
.execpane{display:none}
.execpane.on{display:block}

.factgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
.fact{background:var(--panel2);padding:9px 11px}
.fact .fl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dimmer);font-family:var(--mono);margin-bottom:3px}
.fact .fv{font-size:12.5px;font-family:var(--mono);color:var(--ink);word-break:break-all}
.fact .fv.g{color:var(--green)} .fact .fv.r{color:var(--red)} .fact .fv.a{color:var(--amber)}
.sha{color:var(--accent)}

/* output block */
.out{margin:0 0 12px;border:1px solid var(--line2);border-left:3px solid var(--out-bar);border-radius:8px;overflow:hidden;background:var(--bg2)}
.outitem{border-bottom:1px solid var(--line)}
.outitem:last-child{border-bottom:0}
.outh{display:flex;align-items:center;gap:8px;padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--dim);background:#0d121d}
.otag{padding:1px 6px;border-radius:4px;font-size:10px;border:1px solid var(--line2)}
.otag.stream{color:var(--dim)} .otag.error{color:var(--red);border-color:#3f1f28;background:#1a0f14}
.otag.result{color:var(--green);border-color:#1c3a24;background:#0e1a12}
.outbody{padding:11px 13px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;line-height:1.65;color:#cdd7e6}
.outbody.err{color:#ffb3c0}
.outbody.md{font-family:var(--sans);font-size:13px;color:#dbe4f2}
.stream-live{position:relative}
.cursorblink{display:inline-block;width:7px;height:14px;background:var(--run);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* files changed */
.files{margin:0}
.filerow{display:flex;align-items:center;gap:10px;padding:7px 13px;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--line)}
.filerow:last-child{border-bottom:0}
.chg{width:16px;text-align:center;font-weight:800;flex-shrink:0}
.chg.added{color:var(--add)} .chg.modified{color:var(--mod)} .chg.deleted{color:var(--del)}
.fpath{color:#cdd7e6}
.chglabel{margin-left:auto;font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.5px}

.summary{margin:0 0 4px;padding:11px 13px;background:linear-gradient(180deg,#14203a,#111a2e);border:1px solid #26385f;border-radius:8px;font-size:13px;color:#dbe6ff}
.summary .sl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-family:var(--mono);margin-bottom:4px;font-weight:700}

.audit{display:flex;gap:14px;flex-wrap:wrap;padding:9px 2px 2px;font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.audit b{color:var(--dim);font-weight:600}

.cellactions{display:flex;gap:8px;padding:6px 16px 16px;flex-wrap:wrap}

.emptyexec{padding:22px 16px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12.5px}
.emptyexec .big{font-size:26px;margin-bottom:8px;color:var(--dimmer)}

/* ---- storage view ---- */
.storage{display:none}
.storage.on{display:block}
.display.off{display:none}
.storhead{margin:6px 0 18px}
.storhead h2{margin:0 0 6px;font-size:19px}

.storgrid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.storgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cardh{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-family:var(--mono);color:var(--dim);display:flex;align-items:center;gap:8px}

/* ---------- flow rail ---------- */
function renderRail(){
  const r=document.getElementById('rail');
  r.innerHTML=TASK.cells.map((c,i)=>{
    const ex=c.executions.length;
    const excmark = c.status==='failed'?`[${ex}]✗`
      : c.status==='running'?`[${c.latest}]…`
      : c.status==='idle'?'[ ]'
      : `[${c.latest}]`;
    return `<div class=&quot;railcell st-${c.status}&quot; data-i=&quot;${i}&quot; onclick=&quot;jump(${i})&quot;>
      <div class=&quot;cn&quot;><span>${String(c.seq).padStart(2,'0')}</span><span class=&quot;exc&quot;>${excmark}</span></div>
      <div class=&quot;railbar&quot;><i></i></div>
      <div class=&quot;ttl&quot;>${c.title}</div>
      <div class=&quot;sub&quot;>${c.status==='idle'?'never run':c.summary.split('—')[0].trim()}</div>
    </div>`;
  }).join('');
}
function jump(i){
  const cells=document.querySelectorAll('.cell');
  cells[i].classList.add('open');
  document.querySelectorAll('.railcell').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.cell').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.railcell')[i].classList.add('active');
  cells[i].classList.add('sel');
  cells[i].scrollIntoView({behavior:'smooth',block:'center'});
}

function outItem(o){

  if(o.type==='result'){label='result'+(o.mime?' · '+o.mime:'');}
  if(o.type==='error'){label='error · '+(o.ename||'Error');}
  let bodyCls = o.type==='error'?'err' : (o.mime==='text/markdown'?'md':'');
  let body = esc(o.text||'');
  if(o.type==='error' &amp;&amp; o.evalue){ body = esc(o.ename+': '+o.evalue)+'\n'+body; }
  if(o.live){ body += '<span class=&quot;cursorblink&quot;></span>'; }
  return `<div class=&quot;outitem&quot;>
    <div class=&quot;outh&quot;><span class=&quot;otag ${tag}&quot;>${tag}</span><span>${esc(label)}</span></div>
    <div class=&quot;outbody ${bodyCls}&quot;>${body}</div>
  </div>`;
}

function execPane(c,e,idx){
  const facts=[
    ['status',`<span class=&quot;fv ${e.status==='done'?'g':e.status==='failed'?'r':e.status==='running'?'a':''}&quot;>${e.status}</span>`],
    ['exit code', e.exit==null?'—':`<span class=&quot;fv ${e.exit===0?'g':'r'}&quot;>${e.exit}</span>`],
    ['tool · model',`${c.tool} · ${c.model}`],
    ['started', nice(e.start)],
    ['finished', nice(e.finish)],
    ['duration', dur(e.dur)],
    ['result commit', e.commit?`<span class=&quot;sha&quot;>${e.commit}</span>`:'—'],
    ['run by', e.runBy],
    ['sys-prompt sha', `<span class=&quot;sha&quot; title=&quot;snapshot at run time — prompt-drift audit&quot;>${e.sysSha}</span>`],
  ];
  if(e.fail) facts.push(['failure kind',`<span class=&quot;fv r&quot;>${e.fail}</span>`]);

  const factHtml=facts.map(f=>`<div class=&quot;fact&quot;><div class=&quot;fl&quot;>${f[0]}</div><div class=&quot;fv&quot;>${f[1]}</div></div>`).join('');

  const outHtml=e.outputs.length?e.outputs.map(outItem).join(''):'<div class=&quot;outbody&quot; style=&quot;color:var(--dimmer)&quot;>no output</div>';

  const fileHtml=e.files.length?e.files.map(f=>{
    const sym=f.c==='added'?'A':f.c==='modified'?'M':'D';
    return `<div class=&quot;filerow&quot;><span class=&quot;chg ${f.c}&quot;>${sym}</span><span class=&quot;fpath&quot;>${f.p}</span><span class=&quot;chglabel&quot;>${f.c}</span></div>`;
  }).join(''):'<div class=&quot;filerow&quot; style=&quot;color:var(--dimmer)&quot;>no files changed</div>';

  return `<div class=&quot;execpane ${idx===0?'on':''}&quot; data-pane=&quot;${e.n}&quot;>
    <div class=&quot;factgrid&quot;>${factHtml}</div>

    <div class=&quot;blocklabel&quot;><span class=&quot;bar out&quot;></span> output · response <span class=&quot;rt&quot;>execution [${e.n}]</span></div>
    <div class=&quot;out&quot;>${outHtml}</div>

    <div class=&quot;blocklabel&quot;><span class=&quot;bar out&quot;></span> files changed <span class=&quot;rt&quot;>${e.files.length} file${e.files.length===1?'':'s'}</span></div>
    <div class=&quot;out files&quot;>${fileHtml}</div>

    <div class=&quot;summary&quot;><div class=&quot;sl&quot;>response summary — editable</div><div class=&quot;prompt&quot; contenteditable=&quot;true&quot; onblur=&quot;editSummary('${c.id}',${e.n},this)&quot;>${esc(e.summary)}</div></div>

    <div class=&quot;audit&quot;>
      <span>run by <b>${e.runBy}</b></span>
      <span>at <b>${nice(e.start)}</b></span>
      <span>execution <b>[${e.n}] of ${c.executions.length}</b></span>
      ${e.commit?`<span>commit <b>${e.commit}</b></span>`:''}
    </div>
  </div>`;
}

function cellHtml(c,i){
  const isIdle=c.status==='idle';
  const src=`
    <div class=&quot;blocklabel&quot;><span class=&quot;bar in&quot;></span> input · source
      <span class=&quot;rt&quot;><button class=&quot;mini&quot; onclick=&quot;toggleEdit(this,event)&quot;>edit prompts</button></span>
    </div>
    <div class=&quot;source&quot;>
      <div class=&quot;srcrow&quot;>
        <div class=&quot;k&quot;>system_prompt <span class=&quot;meta&quot;>origin ${c.source.system.origin}</span></div>
        <div class=&quot;prompt&quot; data-role=&quot;sys&quot; onblur=&quot;editPrompt('${c.id}','sys',this)&quot;>${esc(c.source.system.text)}</div>
        <div class=&quot;origin&quot;>snapshot <b>${c.source.system.sha}</b> · canonical lives once in pipeline def</div>
      </div>
      <div class=&quot;srcrow&quot;>
        <div class=&quot;k&quot;>user_prompt <span class=&quot;meta&quot;>author ${c.source.user.author}</span></div>
        <div class=&quot;prompt&quot; data-role=&quot;user&quot; onblur=&quot;editPrompt('${c.id}','user',this)&quot;>${esc(c.source.user.text)}</div>
        ${c.source.user.attachments.length?c.source.user.attachments.map(a=>`<span class=&quot;attach&quot;>📎 ${a}</span>`).join(' '):''}
      </div>
    </div>`;

  let execBlock;
  if(isIdle){
    execBlock=`<div class=&quot;execs&quot;>
      <div class=&quot;emptyexec&quot;><div class=&quot;big&quot;>▷</div>executions [] — never run. Press <b>Run stage</b> to create execution [1].</div>
    </div>`;
  }else{
    const tabs=c.executions.map((e,idx)=>`<button class=&quot;exectab ${idx===0?'on':''}&quot; onclick=&quot;switchExec('${c.id}',${e.n},this)&quot;>
        <span>[${e.n}]</span>
        <span class=&quot;mk ${e.status==='done'?'ok':e.status==='failed'?'no':''}&quot;>${e.status==='done'?'✓':e.status==='failed'?'✗':e.status==='running'?'…':''}</span>
      </button>`).join('');
    const panes=[...c.executions].reverse().map((e,idx)=>execPane(c,e,idx)).join('');
    execBlock=`<div class=&quot;execs&quot;>
      <div class=&quot;exectabs&quot;>${tabs}<span class=&quot;hint&quot;>&amp;nbsp;re-run appends [${c.executions.length+1}] — history kept</span></div>
      ${panes}
    </div>`;
  }

  const runLabel = c.status==='running'?'Running…' : c.status==='idle'?'Run stage ▷' : 'Re-run ↻';
  const headSummary = isIdle?'idle · never run' : c.summary;

  return `<div class=&quot;cell st-${c.status}&quot; data-id=&quot;${c.id}&quot; data-i=&quot;${i}&quot;>
    <div class=&quot;cellhead&quot; onclick=&quot;toggleCell(this,event)&quot;>
      <span class=&quot;execn&quot;>${isIdle?'[ ]':'In [<b>'+c.latest+'</b>]'}</span>
      <span class=&quot;stgtitle&quot;><span class=&quot;dot d-${c.status}&quot;></span>${String(c.seq).padStart(2,'0')} · ${c.title}</span>
      <span class=&quot;stgsum&quot;>${esc(headSummary)}</span>
      <span class=&quot;headmeta&quot;>
        <span class=&quot;tag&quot;>${c.tool}</span>
        <span class=&quot;tag s-${c.status}&quot;>${c.status}${c.executions.length>1?' ·['+c.executions.length+']':''}</span>
        <span class=&quot;chev&quot;>▶</span>
      </span>
    </div>
    <div class=&quot;cellbody&quot;>
      <div style=&quot;padding:10px 16px 2px;color:var(--dim);font-size:12px;font-style:italic&quot;>${esc(c.goal)}</div>
      ${src}
      ${execBlock}
      <div class=&quot;cellactions&quot;>
        <button class=&quot;btn primary&quot; onclick=&quot;runStage('${c.id}',event)&quot;>${runLabel}</button>
        <button class=&quot;btn&quot; onclick=&quot;toast('Diff of ${c.executions.length?'[1]…['+c.latest+']':'—'} — demo')&quot;>Compare runs</button>
      </div>
    </div>
  </div>`;
}

function renderNotebook(){
  document.getElementById('notebook').innerHTML=TASK.cells.map(cellHtml).join('');
  // open the running + failed cells by default so nothing is buried
  document.querySelectorAll('.cell').forEach((el,i)=>{
    if(['running','failed'].includes(TASK.cells[i].status) || TASK.cells[i].id==='03-spec') el.classList.add('open');
  });
}

/* ---------- interactions ---------- */
function toggleCell(head,ev){ if(ev.target.closest('button,[contenteditable]'))return; head.parentElement.classList.toggle('open'); }
function toggleEdit(btn,ev){ ev.stopPropagation();
  const src=btn.closest('.cellbody').querySelector('.source');
  const eds=src.querySelectorAll('.prompt');
  const on=btn.textContent==='edit prompts';
  eds.forEach(e=>e.setAttribute('contenteditable',on));
  btn.textContent=on?'done editing':'edit prompts';
  if(on){eds[0].focus();toast('Prompts editable — click out to save');}
}
function editPrompt(id,role,el){
  const c=TASK.cells.find(x=>x.id===id);
  if(role==='sys')c.source.system.text=el.textContent;else c.source.user.text=el.textContent;
  toast('Saved '+role+'_prompt for '+id);
}
function editSummary(id,n,el){
  const c=TASK.cells.find(x=>x.id===id);const e=c.executions.find(x=>x.n===n);
  if(e){e.summary=el.textContent;toast('Saved summary for '+id+' ['+n+']');renderRail();}
}
function switchExec(id,n,btn){
  const cell=btn.closest('.cell');
  cell.querySelectorAll('.exectab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  cell.querySelectorAll('.execpane').forEach(p=>p.classList.toggle('on',p.dataset.pane==n));
}
function runStage(id,ev){ ev.stopPropagation();
  const c=TASK.cells.find(x=>x.id===id);
  const next=(c.executions.length?Math.max(...c.executions.map(e=>e.n)):0)+1;
  toast(c.status==='idle'?`Run stage → creates execution [${next}]`:`Re-run ${id} → appends execution [${next}] (history kept)`);
}
function expandAll(on){ document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('open',on)); }

/* ---------- view toggle ---------- */
function setView(v){
  const disp=v==='display';
  document.getElementById('displayView').classList.toggle('off',!disp);
  document.getElementById('storageView').classList.toggle('on',!disp);
  document.getElementById('tDisplay').classList.toggle('on',disp);
  document.getElementById('tStorage').classList.toggle('on',!disp);
  if(!disp)renderStorage();
}

function syntaxJson(obj){
  let json=JSON.stringify(obj,null,2);
  json=json.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');
  return json.replace(/(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&quot;])*&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,
    (m)=>{
      let cls='tok-num';
      if(/^&quot;/.test(m)){cls=/:$/.test(m)?'tok-key':'tok-str';}
      else if(/true|false/.test(m))cls='tok-bool';
      else if(/null/.test(m))cls='tok-null';
      return `<span class=&quot;${cls}&quot;>${m}</span>`;
    });
}
function showJson(key){
  const s=JSON_SAMPLES[key]||JSON_SAMPLES['03-spec'];
  document.getElementById('jsonFile').textContent=s.name;
  document.getElementById('jsonNote').textContent=s.note;
  document.getElementById('jsonView').innerHTML = s.obj===null
    ? `<span class=&quot;tok-cmt&quot;>${esc(s.raw)}</span>`
    : syntaxJson(s.obj);
}

/* ---------- live streaming demo for the running cell ---------- */
function startLiveStream(){
  const chunks=[
    &quot;\n… pricing: 3 tiers rendered — acceptance 1/3&quot;,
    &quot;\n… pricing: monthly/annual toggle wired — acceptance 2/3&quot;,
    &quot;\n✓ pricing built — acceptance 3/3 pass.&quot;,
    &quot;\n… building faq section&quot;,
    &quot;\n✓ faq built — acceptance 2/2 pass.&quot;,
    &quot;\n… building signup-cta section&quot;
  ];
  let i=0;
  setInterval(()=>{
    const cell=document.querySelector('.cell[data-id=&quot;04-build&quot;]');
    if(!cell||!cell.classList.contains('open'))return;
    const blink=cell.querySelector('.outbody .cursorblink');
    if(!blink)return;
    // append next chunk before the blinking cursor; cycle the reel but
    // trim the streamed buffer so the demo never grows unbounded
    const txt=chunks[i%chunks.length];
    blink.insertAdjacentText('beforebegin',txt);
    const live=blink.parentElement;
    const nodes=[...live.childNodes].filter(n=>n.nodeType===3);
    while(nodes.length>9){ live.removeChild(nodes.shift()); }
    i++;
  },2600);
}

  display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
  color:var(--ink-3);font-weight:640;margin-bottom:7px;
}
.field-label .ico{width:13px;height:13px;color:var(--ink-4)}
.field-label .editmark{margin-left:auto;font-size:10px;letter-spacing:0;text-transform:none;color:var(--ink-4);
  display:flex;align-items:center;gap:4px;font-weight:500}
.field-label .editmark svg{width:11px;height:11px}

.editable{
  background:var(--bg-canvas);border:1px solid var(--line-soft);border-radius:9px;padding:10px 12px;
  font-size:12.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
  transition:border-color .15s,background .15s;cursor:text;position:relative;
}
.editable:hover{border-color:var(--line)}
.editable:focus{outline:none;border-color:var(--accent);background:var(--panel);color:var(--ink)}
.editable.mono{font-family:var(--mono);font-size:11.5px}
.editable[data-empty]:empty::before{content:attr(data-empty);color:var(--ink-4);font-style:italic}

.sysprompt{position:relative}
.snapref{
  font-family:var(--mono);font-size:10px;color:var(--ink-4);margin-top:6px;display:flex;align-items:center;gap:6px;
}
.snapref .badge{background:var(--panel-3);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--accent-dim)}

.gridfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metacard{background:var(--bg-canvas);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.metacard .mk{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-4);margin-bottom:4px}
.metacard .mv{font-family:var(--mono);font-size:12px;color:var(--ink);display:flex;align-items:center;gap:7px}
.metacard .mv .beacon{width:7px;height:7px;border-radius:50%}
.mv.ok{color:var(--done)}
.mv.bad{color:var(--failed)}
.mv.run{color:var(--running)}

.files{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden}
.filerow{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--bg-canvas);font-family:var(--mono);font-size:11.5px}
.chgtag{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}
.chgtag.added{background:oklch(0.74 0.15 158/.15);color:var(--add)}
.chgtag.modified{background:oklch(0.82 0.15 85/.15);color:var(--mod)}
.chgtag.deleted{background:oklch(0.68 0.19 22/.15);color:var(--del)}
.filerow .fpath{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .fchg{margin-left:auto;color:var(--ink-4);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.files-empty{padding:11px;font-size:11.5px;color:var(--ink-4);font-style:italic;font-family:var(--sans);text-align:center;background:var(--bg-canvas)}

.response-box{
  background:oklch(0.12 0.014 265);border:1px solid var(--line-soft);border-radius:9px;
  font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--ink-2);
  padding:11px 13px;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;
}
.response-box .rline.pass{color:var(--done)}
.response-box .rline.fail{color:var(--failed)}
.response-box .caret{display:inline-block;width:8px;height:14px;background:var(--running);vertical-align:-2px;animation:blink 1s step-end infinite;margin-left:2px}

.audit{border-top:1px solid var(--line-soft);margin-top:6px;padding-top:14px}
.audit-row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-3);padding:4px 0;font-family:var(--mono)}
.audit-row .ai{width:14px;height:14px;color:var(--ink-4);flex-shrink:0}
.audit-row b{color:var(--ink-2);font-weight:500}
.audit-row .who{color:var(--accent-dim)}

.sheet-actions{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--panel-2)}
.btn{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:560;border:1px solid var(--line);color:var(--ink-2);background:var(--panel-3);display:flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--line-soft);color:var(--ink)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);color:oklch(0.14 0.014 265);border-color:var(--accent);font-weight:640}
.btn.primary:hover{background:oklch(0.77 0.15 255)}
.btn.ghostwarn:hover{color:var(--failed);border-color:var(--failed-dim)}
.save-toast{margin-left:auto;font-size:11.5px;color:var(--done);display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .2s}
.save-toast.show{opacity:1}

/* ============ STORAGE VIEW ============ */
#storageView{overflow:auto;padding:26px 30px 60px}
.storage-inner{max-width:1180px;margin:0 auto}
.storage-hero{margin-bottom:26px}
.storage-hero h1{margin:0 0 8px;font-size:23px;letter-spacing:-0.025em}
.storage-hero p{margin:0;color:var(--ink-3);max-width:70ch;font-size:13.5px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:10px}
.storage-cols{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.storage-cols{grid-template-columns:1fr}}

.tree-card,.json-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:13px;overflow:hidden}
.card-head{padding:11px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2);background:var(--panel-2)}
.card-head .dotrow{display:flex;gap:6px;margin-right:3px}
.card-head .dotrow i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.card-head .fname{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.card-head .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-4);border:1px solid var(--line);border-radius:5px;padding:1px 7px}

.tree{padding:13px 12px;font-family:var(--mono);font-size:12px;line-height:1.85}
.tree .row{display:flex;align-items:center;gap:8px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.tree .row.file{cursor:pointer}
.tree .row.file:hover{background:var(--panel-3)}
.tree .row.active{background:oklch(0.72 0.15 255/.13)}
.tree .tw{color:var(--ink-4)}
.tree .fico{width:13px;flex-shrink:0}
.tree .dir{color:var(--running)}
.tree .fjson{color:var(--ink-2)}
.tree .fjson b{color:var(--ink);font-weight:500}
.tree .note{color:var(--ink-4);font-family:var(--sans);font-size:10.5px;font-style:italic;margin-left:6px}
.tree .stbadge{margin-left:6px;font-family:var(--sans);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:20px}
.stbadge.running{color:var(--running);background:oklch(0.78 0.15 235/.14)}
.stbadge.failed{color:var(--failed);background:oklch(0.68 0.19 22/.14)}
.stbadge.rerun{color:var(--warn);background:oklch(0.82 0.15 85/.13)}

.tree-foot{padding:11px 15px;border-top:1px solid var(--line-soft);background:var(--panel-2);font-size:12px;color:var(--ink-2);line-height:1.5}
.tree-foot .lead{color:var(--done);font-weight:600}

.json-card pre{margin:0;padding:16px 17px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.62;max-height:640px;color:var(--ink-2)}
.tok-key{color:var(--accent)}
.tok-str{color:oklch(0.8 0.13 145)}
.tok-num{color:oklch(0.82 0.13 60)}
.tok-bool{color:oklch(0.78 0.14 300)}
.tok-null{color:var(--ink-4)}
.tok-com{color:var(--ink-4);font-style:italic}
.tok-punc{color:var(--ink-3)}

.jsonswitch{display:flex;gap:2px;padding:9px 13px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);flex-wrap:wrap}
.jsonswitch button{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:7px;color:var(--ink-3);border:1px solid transparent}
.jsonswitch button:hover{color:var(--ink-2)}
.jsonswitch button.active{background:var(--panel-3);color:var(--ink);border-color:var(--line)}

.model-note{margin-top:22px;background:var(--panel);border:1px solid var(--line-soft);border-radius:13px;padding:16px 18px}
.model-note h3{margin:0 0 8px;font-size:14px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.model-note h3 .split{display:flex;gap:6px}
.model-note h3 .split span{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2)}
.model-note p{margin:0;color:var(--ink-3);font-size:12.5px;line-height:1.55;max-width:78ch}
.model-note code{font-family:var(--mono);background:var(--bg-canvas);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;font-size:11.5px;color:var(--ink-2)}
.hl{color:var(--accent-dim)}
</style>
</head>
<body>

<div class=&quot;stage-wrap&quot;>

  <!-- ===================== DISPLAY / CANVAS ===================== -->
  <div class=&quot;view&quot; id=&quot;displayView&quot;>
    <div class=&quot;canvas-toolbar&quot;>
      <div class=&quot;legend&quot;>
        <span class=&quot;dot&quot;><span class=&quot;swatch done&quot;></span>done</span>
        <span class=&quot;dot&quot;><span class=&quot;swatch running&quot;></span>running</span>

        <span class=&quot;dot&quot;><span class=&quot;swatch idle&quot;></span>idle</span>
      </div>
      <span class=&quot;tb-hint&quot;>drag nodes to reposition · click a node to open detail · <kbd>Esc</kbd> to close</span>
      <div class=&quot;zoomctl&quot;>
        <button id=&quot;zoomOut&quot; title=&quot;Zoom out&quot;>&amp;minus;</button>
        <span class=&quot;zval&quot; id=&quot;zoomVal&quot;>100%</span>
        <button id=&quot;zoomIn&quot; title=&quot;Zoom in&quot;>+</button>
        <button id=&quot;zoomFit&quot; title=&quot;Reset&quot; style=&quot;width:auto;padding:0 8px;font-size:11px;font-family:var(--mono)&quot;>fit</button>
      </div>
    </div>
    <div class=&quot;canvas-scroll&quot; id=&quot;canvasScroll&quot;>
      <div id=&quot;canvas&quot;>
        <svg id=&quot;wires&quot;></svg>
        <!-- nodes injected -->
      </div>
    </div>
  </div>

  <!-- ===================== STORAGE ===================== -->
  <div class=&quot;view&quot; id=&quot;storageView&quot; hidden>
    <div class=&quot;storage-inner&quot;>
      <div class=&quot;storage-hero&quot;>
        <div class=&quot;kicker&quot;>on-disk layout · spatial node-canvas</div>
        <h1>One <code style=&quot;font-family:var(--mono);font-size:0.82em;color:var(--accent)&quot;>*.stage.json</code> per node, one <code style=&quot;font-family:var(--mono);font-size:0.82em;color:var(--accent)&quot;>graph.json</code> for the wiring.</h1>
        <p>Two orthogonal concerns, split by file: <b style=&quot;color:var(--ink-2)&quot;>what a stage is</b> (prompts, runs, results) lives in a flat stage file; <b style=&quot;color:var(--ink-2)&quot;>where it sits</b> (x/y + edges) lives only in graph.json. Drag a node and the diff is one file, a handful of numbers.</p>
      </div>

      <div class=&quot;storage-cols&quot;>

          <div class=&quot;card-head&quot;><span class=&quot;dotrow&quot;><i></i><i></i><i></i></span><span class=&quot;fname&quot;>.bridza/</span><span class=&quot;tag&quot;>workspace</span></div>

            <div class=&quot;row&quot;><span class=&quot;tw&quot;>▸</span><svg class=&quot;fico dir&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;><path d=&quot;M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z&quot;/></svg><span class=&quot;dir&quot;>.bridza</span></div>
            <div class=&quot;row&quot; style=&quot;padding-left:20px&quot;><span class=&quot;tw&quot;>▸</span><svg class=&quot;fico dir&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;><path d=&quot;M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z&quot;/></svg><span class=&quot;dir&quot;>tasks</span></div>
            <div class=&quot;row&quot; style=&quot;padding-left:40px&quot;><span class=&quot;tw&quot;>▾</span><svg class=&quot;fico dir&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;><path d=&quot;M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z&quot;/></svg><span class=&quot;dir&quot;>506-q3-launch-microsite</span></div>

            <div class=&quot;row file&quot; data-json=&quot;task&quot; style=&quot;padding-left:60px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;><b>task</b>.json</span><span class=&quot;note&quot;>title · flow ref · branch · cursor</span></div>
            <div class=&quot;row file&quot; data-json=&quot;graph&quot; style=&quot;padding-left:60px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;><b>graph</b>.json</span><span class=&quot;note&quot;>node x/y + edges · spatial only</span></div>

            <div class=&quot;row&quot; style=&quot;padding-left:60px&quot;><span class=&quot;tw&quot;>▾</span><svg class=&quot;fico dir&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;><path d=&quot;M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z&quot;/></svg><span class=&quot;dir&quot;>stages</span><span class=&quot;note&quot;>flat · one file per stage</span></div>
            <div class=&quot;row file&quot; data-json=&quot;research&quot; style=&quot;padding-left:80px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;>research.stage.json</span></div>
            <div class=&quot;row file&quot; data-json=&quot;planning&quot; style=&quot;padding-left:80px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;>planning.stage.json</span></div>
            <div class=&quot;row file&quot; data-json=&quot;spec&quot; style=&quot;padding-left:80px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;>spec.stage.json</span></div>
            <div class=&quot;row file&quot; data-json=&quot;build&quot; style=&quot;padding-left:80px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;>build.stage.json</span><span class=&quot;stbadge running&quot;>running</span></div>
            <div class=&quot;row file&quot; data-json=&quot;verify&quot; style=&quot;padding-left:80px&quot;><span class=&quot;tw&quot;> </span><svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg><span class=&quot;fjson&quot;>verify.stage.json</span><span class=&quot;stbadge rerun&quot;>re-run ×2</span></div>
          </div>
          <div class=&quot;tree-foot&quot;>
            <span class=&quot;lead&quot;>Kills the sparse-folders problem:</span> no <code style=&quot;font-family:var(--mono);color:var(--ink-3)&quot;>context.md</code>, <code style=&quot;font-family:var(--mono);color:var(--ink-3)&quot;>prompts.md</code>, or <code style=&quot;font-family:var(--mono);color:var(--ink-3)&quot;>outputs/.gitkeep</code> — each stage collapses to a single readable JSON, and the whole task is 7 files instead of ~30.
          </div>
        </div>

        <div class=&quot;json-card&quot;>
          <div class=&quot;jsonswitch&quot; id=&quot;jsonSwitch&quot;>
            <button data-json=&quot;verify&quot; class=&quot;active&quot;>verify.stage.json</button>
            <button data-json=&quot;build&quot;>build.stage.json</button>
            <button data-json=&quot;graph&quot;>graph.json</button>
            <button data-json=&quot;task&quot;>task.json</button>
            <button data-json=&quot;research&quot;>research.stage.json</button>
          </div>
          <div class=&quot;card-head&quot; style=&quot;border-top:none&quot;>
            <svg class=&quot;fico fjson&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; style=&quot;width:13px&quot;><path d=&quot;M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z&quot;/><path d=&quot;M14 3v5h5&quot;/></svg>
            <span class=&quot;fname&quot; id=&quot;jsonPath&quot;>stages/verify.stage.json</span>
            <span class=&quot;tag&quot; id=&quot;jsonSchema&quot;>bridza.stage/v1</span>
          </div>
          <pre id=&quot;jsonView&quot;></pre>
        </div>
      </div>

      <div class=&quot;model-note&quot;>
        <h3><span class=&quot;split&quot;><span>*.stage.json</span><span>graph.json</span></span> why two files, not one</h3>

const $=(s,r=document)=>r.querySelector(s);

const fmtDur=ms=>{if(ms==null)return &quot;—&quot;;const s=Math.round(ms/1000);return s<60?s+&quot;s&quot;:Math.floor(s/60)+&quot;m &quot;+String(s%60).padStart(2,&quot;0&quot;)+&quot;s&quot;;};
const fmtTime=iso=>{if(!iso)return &quot;—&quot;;const d=new Date(iso);return d.toLocaleString(undefined,{month:&quot;short&quot;,day:&quot;numeric&quot;,hour:&quot;2-digit&quot;,minute:&quot;2-digit&quot;});};
function liveDur(iso){const s=Math.round((Date.now()-new Date(iso).getTime())/1000);const m=Math.floor(s/60);return m+&quot;m &quot;+String(s%60).padStart(2,&quot;0&quot;)+&quot;s&quot;;}
function latestRun(st){return st.runs.find(r=>r.id===st.activeRun)||st.runs[st.runs.length-1];}

function buildNodes(){

        <span class=&quot;runs&quot; title=&quot;${st.runs.length} run(s)&quot;>${badges}</span>

    canvas.appendChild(el);

function nodeHeight(stage){return nodeEls[stage].offsetHeight;}

function drawWires(){
  wires.innerHTML=&quot;&quot;;
  const ns=&quot;http://www.w3.org/2000/svg&quot;;
  GRAPH.edges.forEach(e=>{
    const a=pos[e.from], b=pos[e.to];
    const ha=nodeHeight(e.from), hb=nodeHeight(e.to);
    const x1=a.x+NODE_W, y1=a.y+ha/2;
    const x2=b.x,        y2=b.y+hb/2;
    const dx=Math.max(48,(x2-x1)*0.5);
    const path=document.createElementNS(ns,&quot;path&quot;);
    path.setAttribute(&quot;d&quot;,`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
    const fromDone=STAGES[e.from].status===&quot;done&quot;;
    const toActive=STAGES[e.to].status===&quot;running&quot;;
    let cls=&quot;wire&quot;; if(fromDone&amp;&amp;toActive)cls+=&quot; flow-active&quot;; else if(fromDone)cls+=&quot; flow-done&quot;;
    path.setAttribute(&quot;class&quot;,cls);
    wires.appendChild(path);
    // arrow cap
    const cap=document.createElementNS(ns,&quot;circle&quot;);
    cap.setAttribute(&quot;cx&quot;,x2);cap.setAttribute(&quot;cy&quot;,y2);cap.setAttribute(&quot;r&quot;,&quot;3.5&quot;);
    cap.setAttribute(&quot;class&quot;,&quot;wire-cap&quot;);
    if(fromDone&amp;&amp;toActive)cap.setAttribute(&quot;fill&quot;,&quot;var(--running-dim)&quot;);
    else if(fromDone)cap.setAttribute(&quot;fill&quot;,&quot;var(--done-dim)&quot;);
    wires.appendChild(cap);
  });
}

/* dragging */
let zoom=1;
function makeDraggable(el,stage){
  let sx,sy,ox,oy,moved;
  el.addEventListener(&quot;pointerdown&quot;,ev=>{
    if(ev.button!==0)return;
    moved=false; sx=ev.clientX; sy=ev.clientY; ox=pos[stage].x; oy=pos[stage].y;
    el.setPointerCapture(ev.pointerId); el.classList.add(&quot;dragging&quot;);
    const move=e=>{
      const dx=(e.clientX-sx)/zoom, dy=(e.clientY-sy)/zoom;
      if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
      pos[stage].x=Math.max(0,ox+dx); pos[stage].y=Math.max(0,oy+dy);
      el.style.left=pos[stage].x+&quot;px&quot;; el.style.top=pos[stage].y+&quot;px&quot;;
      growCanvas(); drawWires();
    };
    const up=e=>{
      el.classList.remove(&quot;dragging&quot;);
      el.releasePointerCapture(ev.pointerId);
      el.removeEventListener(&quot;pointermove&quot;,move);
      el.removeEventListener(&quot;pointerup&quot;,up);
      if(!moved)openSheet(stage);
    };
    el.addEventListener(&quot;pointermove&quot;,move);
    el.addEventListener(&quot;pointerup&quot;,up);
  });
}
function growCanvas(){
  let maxX=1200,maxY=560;
  Object.entries(pos).forEach(([s,p])=>{maxX=Math.max(maxX,p.x+NODE_W+80);maxY=Math.max(maxY,p.y+(nodeEls[s]?nodeEls[s].offsetHeight:120)+80);});
  canvas.style.width=maxX+&quot;px&quot;; canvas.style.height=maxY+&quot;px&quot;;
  wires.setAttribute(&quot;width&quot;,maxX); wires.setAttribute(&quot;height&quot;,maxY);
  wires.style.width=maxX+&quot;px&quot;; wires.style.height=maxY+&quot;px&quot;;
}

/* zoom */
function applyZoom(z){
  zoom=Math.min(1.4,Math.max(0.5,z));
  canvas.style.transform=`scale(${zoom})`;
  $(&quot;#zoomVal&quot;).textContent=Math.round(zoom*100)+&quot;%&quot;;
}
$(&quot;#zoomIn&quot;).onclick=()=>applyZoom(zoom+0.1);
$(&quot;#zoomOut&quot;).onclick=()=>applyZoom(zoom-0.1);
$(&quot;#zoomFit&quot;).onclick=()=>{applyZoom(1);scroll.scrollTo({left:0,top:0,behavior:&quot;smooth&quot;});};

function statSmall(status){
  const map={done:&quot;var(--done)&quot;,running:&quot;var(--running)&quot;,failed:&quot;var(--failed)&quot;,idle:&quot;var(--idle)&quot;};
  return `<span style=&quot;display:inline-flex;align-items:center;gap:6px&quot;><span style=&quot;width:7px;height:7px;border-radius:50%;background:${map[status]}&quot;></span>${status}</span>`;
}

function saveEdits(){
  const st=STAGES[sheetState.stage];
  const run=st.runs.find(r=>r.id===sheetState.runId)||latestRun(st);
  $$(&quot;.editable[data-field]&quot;,sheet).forEach(el=>{
    const f=el.dataset.field, v=el.innerText.trim();
    if(f===&quot;systemPrompt&quot;)st.systemPrompt=v;
    else run[f]=v||null;
  });
  // reflect summary back into the node card
  const nodeSum=$(&quot;.node-summary&quot;,nodeEls[st.id]);
  if(nodeSum &amp;&amp; latestRun(st).summary) nodeSum.textContent=latestRun(st).summary;
  // keep the storage JSON view honest with the freshly-saved data
  if(typeof renderJSON===&quot;function&quot; &amp;&amp; JSON_DOCS[st.id]) renderJSON(activeJson);
  const t=$(&quot;#saveToast&quot;); t.classList.add(&quot;show&quot;); setTimeout(()=>t.classList.remove(&quot;show&quot;),2400);
}

function openSheet(stage){
  sheetState.stage=stage; sheetState.runId=STAGES[stage].activeRun;
  renderSheet();
  sheet.classList.add(&quot;open&quot;); scrim.classList.add(&quot;show&quot;); sheet.setAttribute(&quot;aria-hidden&quot;,&quot;false&quot;);
  $$(&quot;.node&quot;).forEach(n=>n.classList.toggle(&quot;selected&quot;,n.dataset.stage===stage));
}
function closeSheet(){
  sheet.classList.remove(&quot;open&quot;); scrim.classList.remove(&quot;show&quot;); sheet.setAttribute(&quot;aria-hidden&quot;,&quot;true&quot;);
  $$(&quot;.node&quot;).forEach(n=>n.classList.remove(&quot;selected&quot;));
}
scrim.onclick=closeSheet;
document.addEventListener(&quot;keydown&quot;,e=>{if(e.key===&quot;Escape&quot;)closeSheet();});

/* ------------------------------------------------------------------ *
 *  live duration ticker for running run                              *
 * ------------------------------------------------------------------ */
setInterval(()=>{
  $$('[data-live]').forEach(el=>{el.textContent=liveDur(el.getAttribute(&quot;data-live&quot;));});
},1000);

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */
$$(&quot;#viewToggle button&quot;).forEach(b=>b.onclick=()=>{

  $(&quot;#storageView&quot;).hidden=(v!==&quot;storage&quot;);
