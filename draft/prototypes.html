/* ---------------- helpers ---------------- */
function esc(s){return String(s).replace(/[&amp;<>]/g,c=>({'&amp;':'&amp;amp;','<':'&amp;lt;','>':'&amp;gt;'}[c]));}
function respHTML(s){
  // escape first, then highlight per-line with non-overlapping token markers so
  // spans never nest and greedy matches never swallow the rest of a sentence.
  return esc(s).split('\n').map(line=>{
    const isErr = /✘|✗|\[ERROR\]/.test(line);
    const isOk  = /✓|✔/.test(line) || /\bnow passes\b/.test(line);
    // highlight only the specific tokens, not the whole line
    let out = line
      .replace(/(✘|✗)/g,'<span class=&quot;err&quot;>$1</span>')
      .replace(/(✓|✔)/g,'<span class=&quot;ok&quot;>$1</span>')
      .replace(/\[ERROR\]/g,'<span class=&quot;err&quot;>[ERROR]</span>')
      .replace(/\b(now passes|passes)\b/g,'<span class=&quot;ok&quot;>$1</span>');
    if(isErr) out = '<span class=&quot;err-line&quot;>'+out+'</span>';
    else if(isOk) out = '<span class=&quot;ok-line&quot;>'+out+'</span>';
    return out;
  }).join('\n');
}
function dur(sec){const m=Math.floor(sec/60),s=sec%60;return m+'m '+String(s).padStart(2,'0')+'s';}
function tfmt(at){const d=new Date(at);return d.toISOString().slice(11,19)+' UTC';}
function statusLabel(s){return {done:'Done',failed:'Failed',running:'Running'}[s]||s;}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------------- build TIMELINE (display) ---------------- */
function pairRuns(events){
  // group into runs {started, finished} and standalone notes, preserving order
  const items=[]; const open={};
  events.forEach(e=>{
    if(e.ev==='run.started'){open[e.run]={start:e,finish:null};items.push({type:'run',run:e.run,ref:open[e.run]});}
    else if(e.ev==='run.finished'){if(open[e.run])open[e.run].finish=e;else items.push({type:'run',run:e.run,ref:{start:null,finish:e}});}
    else if(e.ev==='note'){items.push({type:'note',note:e});}
  });
  return items;
}

}

    let first=true;
    items.forEach(it=>{
      if(it.type==='note'){html+=noteCard(it.note);}
      else{
        html+=runCard(stage,it,0);
        if(first){anchors.push(stage.no+'-'+it.run);first=false;}

/* ---------------- STORAGE ndjson renderer ---------------- */
function jsonHTML(obj){
  const j=JSON.stringify(obj);
  // token-ish coloring
  return j.replace(/&quot;(\\.|[^&quot;\\])*&quot;(?=\s*:)/g,m=>'<span class=&quot;k&quot;>'+m+'</span>')
          .replace(/:\s*&quot;(\\.|[^&quot;\\])*&quot;/g,m=>m.replace(/&quot;(\\.|[^&quot;\\])*&quot;$/,x=>': <span class=&quot;s&quot;>'+x+'</span>').replace(/^:\s*/,': '))
          .replace(/:\s*(-?\d+)/g,': <span class=&quot;n&quot;>$1</span>')
          .replace(/:\s*null/g,': <span class=&quot;nul&quot;>null</span>')
          .replace(/:\s*(true|false)/g,': <span class=&quot;b&quot;>$1</span>');
}
function evTypeClass(ev){return {'run.started':'started','run.finished':'finished','note':'note'}[ev];}
function evLabel(ev){return {'run.started':'run.started','run.finished':'run.finished','note':'note'}[ev];}

function showStage(file){
  const stage=STAGES.find(s=>s.file.startsWith(file));
  document.querySelectorAll('.tree .row.clickable').forEach(r=>r.classList.toggle('active',r.dataset.file===file));
  document.getElementById('st-fname').textContent='stages/'+stage.file;
  const notes={'1-research':'clean single run','2-planning':'clean single run','3-spec':'clean single run','4-build':'failed run #1 → human note → fixed run #2','5-verify':'open run — live, no run.finished yet'};
  document.getElementById('st-note').textContent=notes[file];
  const view=document.getElementById('ndjson-view');
  let html='';
  stage.events.forEach((e,i)=>{
    const isFail=e.ev==='run.finished'&amp;&amp;e.status==='failed';
    const cls=evTypeClass(e.ev)+(isFail?' fail':'');
    const raw=jsonHTML(e);
    let label=evLabel(e.ev);
    if(e.run)label+=' #'+e.run;
    html+=`<div class=&quot;ev&quot; id=&quot;ev-${file}-${i}&quot;>
      <div class=&quot;ev-head&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;>
        <span class=&quot;ev-type ${cls}&quot;>${label}</span>
        <span class=&quot;ev-seq&quot;>seq ${e.seq}</span>
        ${e.status?`<span style=&quot;font-size:10px;color:${isFail?'var(--fail)':'var(--ok)'}&quot;>${e.status}</span>`:''}
        ${e.kind?`<span style=&quot;font-size:10px;color:var(--accent2)&quot;>${e.kind}</span>`:''}
        <span class=&quot;ev-at&quot;>${e.at}</span>
      </div>
      <div class=&quot;ev-raw&quot;><pre>${raw}</pre></div>
    </div>`;
  });
  view.innerHTML=html;
  window._rawOpen=false;
  document.getElementById('raw-lbl').textContent='expand all';
}
function toggleRaw(){
  window._rawOpen=!window._rawOpen;
  document.querySelectorAll('#ndjson-view .ev').forEach(e=>e.classList.toggle('open',window._rawOpen));
  document.getElementById('raw-lbl').textContent=window._rawOpen?'collapse all':'expand all';
}

  .pr{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:14px}
  @media(max-width:1000px){.pr{grid-template-columns:1fr}}
  .pr-main{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card+.card{margin-top:16px}
  .card-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card-h h2{margin:0;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;text-transform:capitalize}
  .card-h .idx{color:var(--ink-4);font-family:var(--mono);font-size:13px}
  .desc{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--bg-2)}
  .desc .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-4);font-weight:700;margin-bottom:6px}
  .desc p{margin:0;color:var(--ink-2);font-size:13.5px}

  /* run tabs */
  .runtabs{display:flex;gap:4px;padding:10px 14px 0;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .runtab{
    all:unset;cursor:pointer;padding:8px 13px 9px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;
    color:var(--ink-3);display:flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:none;position:relative;top:1px;
  }
  .runtab:hover{color:var(--ink)}
  .runtab.active{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .runtab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .runtab .rn{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

  .runbody{display:none;padding:0}
  .runbody.active{display:block}

  /* provenance strip */
  .prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .prov .cell{background:var(--panel);padding:10px 14px}
  .prov .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-4);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .prov .v{font-size:12.5px;color:var(--ink);font-family:var(--mono);word-break:break-all}
  .prov .v.mut{color:var(--ink-3)}
  .sha{color:var(--accent);cursor:pointer;text-decoration:none;background:none;border:none;font:inherit;padding:0}
  .sha:hover{text-decoration:underline}

  /* failure banner */
  .failbanner{margin:14px 18px 0;background:var(--red-bg);border:1px solid rgba(248,81,73,.35);border-radius:9px;padding:11px 14px;font-size:13px;color:#ffb3ae}
  .failbanner b{color:var(--red)}
  .failbanner code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;color:#ffd3d0}

  /* response block */
  .resp{margin:14px 18px 0;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .resp .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-4);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .resp p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.55}

  /* userprompt in run */
  .uprompt{margin:14px 18px 0;background:linear-gradient(180deg,rgba(124,92,255,.06),transparent);border:1px solid var(--line-2);border-left:3px solid var(--accent-2);border-radius:9px;padding:11px 14px}
  .uprompt .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent-2);font-weight:700;margin-bottom:5px}
  .uprompt p{margin:0;color:var(--ink);font-size:13px}

  /* systemprompt inline (collapsible) */
  .sysinline{margin:14px 18px 0;background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;overflow:hidden}
  .sysinline summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);font-weight:700}
  .sysinline summary::-webkit-details-marker{display:none}
  .sysinline summary .chev{color:var(--ink-4);transition:transform .15s;font-size:10px}
  .sysinline[open] summary .chev{transform:rotate(90deg)}
  .sysinline summary .snap{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);text-transform:none;letter-spacing:0;font-weight:400}
  .sysinline .sysbody{padding:0 14px 12px;color:var(--ink-2);font-size:12.5px;line-height:1.55}

  /* file changeset */
  .changeset{margin:16px 14px 16px}
  .cs-h{display:flex;align-items:center;gap:12px;padding:0 4px 10px;color:var(--ink-3);font-size:12.5px;flex-wrap:wrap}
  .cs-h .stat{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px}
  .cs-h .adds{color:var(--green)}.cs-h .dels{color:var(--red)}
  .cs-h .toggleall{margin-left:auto;font-size:12px}
  .btnlink{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
  .btnlink:hover{text-decoration:underline}
  .btnlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .file{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;background:var(--bg-2)}
  .file-h{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;user-select:none;width:100%;background:none;border:none;text-align:left;font:inherit;color:inherit}
  .file-h:hover{background:var(--panel-2)}
  .file-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .chev{color:var(--ink-4);transition:transform .15s;font-size:11px;width:12px;display:inline-block;flex:none}
  .file.open .file-h .chev{transform:rotate(90deg)}
  .fmark{font-family:var(--mono);font-size:10px;font-weight:800;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
  .m-added{color:var(--green);background:var(--add-bg);border:1px solid rgba(63,185,80,.35)}
  .m-modified{color:var(--amber);background:var(--amber-bg);border:1px solid rgba(210,153,34,.35)}
  .m-deleted{color:var(--red);background:var(--red-bg);border:1px solid rgba(248,81,73,.35)}
  .m-running{color:var(--run);background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35)}
  .fpath{font-family:var(--mono);font-size:12.5px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fpath .dir{color:var(--ink-4)}
  .fstat{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;flex:none}
  .fstat .a{color:var(--green)}.fstat .d{color:var(--red)}
  .barsq{display:flex;gap:2px}
  .barsq i{width:7px;height:7px;border-radius:2px;background:var(--line-2)}
  .barsq i.a{background:var(--green)}.barsq i.d{background:var(--red)}

  .diff{display:none;border-top:1px solid var(--line);overflow-x:auto;background:#0a0c0f}
  .file.open .diff{display:block}
  .diff table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
  .diff td{padding:0 12px;white-space:pre;line-height:1.55;vertical-align:top}
  .diff .ln{text-align:right;color:var(--ink-4);width:1%;user-select:none;padding:0 8px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
  .diff tr.add{background:var(--add-line)}
  .diff tr.add td:last-child{color:#7ee787}
  .diff tr.add .gut{color:var(--green)}
  .diff tr.del{background:var(--del-line)}
  .diff tr.del td:last-child{color:#ffa198}
  .diff tr.del .gut{color:var(--red)}
  .diff tr.hunk td{color:var(--accent);background:rgba(90,169,255,.06);font-weight:600}
  .diff .gut{width:14px;padding:0 4px 0 10px;user-select:none;color:var(--ink-4)}

  /* ---- side rail ---- */
  .rail{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow:auto}
  @media(max-width:1000px){.rail{position:static;max-height:none}}
  .rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .rcard h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-4);font-weight:700;display:flex;align-items:center;gap:7px}
  .rrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
  .rrow:last-child{border-bottom:none}
  .rrow .k{color:var(--ink-3)}
  .rrow .v{color:var(--ink);font-family:var(--mono);text-align:right}
  .sys{font-size:12.5px;color:var(--ink-2);line-height:1.55;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:150px;overflow:auto}
  .sysref{font-size:11px;color:var(--ink-4);font-family:var(--mono);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pill{background:var(--bg-2);border:1px solid var(--line-2);border-radius:20px;padding:2px 9px;font-size:11px;font-family:var(--mono);color:var(--ink-2)}
  .pill.warn{border-color:rgba(210,153,34,.4);color:var(--amber)}
  .editbtn{all:unset;cursor:pointer;margin-top:11px;width:100%;text-align:center;padding:8px;border-radius:8px;
    border:1px solid var(--line-2);color:var(--ink-2);font-size:12.5px;font-weight:600;box-sizing:border-box;transition:.15s}
  .editbtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(90,169,255,.06)}
  .editbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .audit{list-style:none;margin:0;padding:0}
  .audit li{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}
  .audit li:last-child{border-bottom:none}
  .audit .tl{color:var(--ink-4);font-family:var(--mono);font-size:11px;flex:none;width:34px}
  .audit .who{color:var(--ink-2)}
  .audit .who b{color:var(--ink)}
  .audit .ic{flex:none}

  /* running live block */
  .live{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(88,166,255,.06);border-bottom:1px solid var(--line);color:var(--run);font-size:13px;font-weight:600}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(88,166,255,.3);border-top-color:var(--run);animation:sp .8s linear infinite}

  .streaming{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);background:#0a0c0f;padding:12px 18px;line-height:1.6;white-space:pre-wrap}

  /* =================== STORAGE view =================== */
  .storelayout{display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media(max-width:900px){.storelayout{grid-template-columns:1fr}}
  .tree{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.95;overflow:auto}
  .tree .t-dir{color:var(--accent)}
  .tree .t-file{color:var(--ink-2);cursor:pointer;border-radius:5px;padding:0 5px;transition:.12s;background:none;border:none;font:inherit}
  .tree .t-file:hover{background:var(--panel-2);color:var(--ink)}
  .tree .t-file:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .tree .t-file.sel{background:rgba(90,169,255,.14);color:var(--ink)}
  .tree .c{color:var(--ink-4)}
  .tree .g{color:var(--green)}
  .storeside{min-width:0}
  .jsonwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .jsonwrap .jh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-2);font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
  .jsonwrap .jh .fmark{width:auto;height:auto;padding:2px 7px}
  .jsonwrap pre{margin:0;padding:16px;overflow:auto;max-height:70vh;font-family:var(--mono);font-size:12px;line-height:1.6}
  .kill{background:linear-gradient(90deg,rgba(63,185,80,.10),transparent);border:1px solid rgba(63,185,80,.3);border-radius:10px;padding:13px 16px;margin-bottom:16px;color:var(--ink-2);font-size:13px}
  .kill b{color:var(--green)}
  .storenote{color:var(--ink-3);font-size:12.5px;margin:14px 2px 0;line-height:1.6}
  .storenote code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--ink-2)}

  /* json syntax */
  .j-key{color:#79c0ff}.j-str{color:#a5d6ff}.j-num{color:#f2cc60}.j-bool{color:#ff7b72}.j-null{color:#ff7b72}.j-punc{color:var(--ink-3)}

  /* modal (edit) */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modalbox{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modalbox .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .modalbox .mh h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  .modalbox .mb{padding:16px 18px}
  .modalbox textarea{width:100%;min-height:120px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);
    font-family:var(--mono);font-size:12.5px;padding:11px;resize:vertical;line-height:1.5}
  .modalbox .fld{margin-bottom:14px}
  .modalbox .fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-4);font-weight:700;margin-bottom:6px}
  .modalbox input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:9px 11px}
  .modalbox .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}
  .btn{all:unset;cursor:pointer;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.ghost{border:1px solid var(--line-2);color:var(--ink-2)}
  .btn.ghost:hover{border-color:var(--ink-3)}
  .btn.prim{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
  .btn.prim:hover{filter:brightness(1.08)}
  .editnote{font-size:11.5px;color:var(--ink-4);margin-top:2px}
  .x{all:unset;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1}.x:hover{color:var(--ink)}
  .x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .icon{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;

  }

function diffTable(diff){
  const lines=diff.split(&quot;\n&quot;);let old=0,neu=0;
  const hdr=lines[0].match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
  if(hdr){old=parseInt(hdr[1]);neu=parseInt(hdr[2]);}
  let rows=&quot;&quot;;
  lines.forEach(l=>{
    if(l.startsWith(&quot;@@&quot;)){rows+=`<tr class=&quot;hunk&quot;><td class=&quot;ln&quot;></td><td class=&quot;ln&quot;></td><td class=&quot;gut&quot;></td><td>${esc(l)}</td></tr>`;
      const h=l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);if(h){old=parseInt(h[1]);neu=parseInt(h[2]);}return;}
    if(l.startsWith(&quot;+&quot;)){rows+=`<tr class=&quot;add&quot;><td class=&quot;ln&quot;></td><td class=&quot;ln&quot;>${neu++}</td><td class=&quot;gut&quot;>+</td><td>${esc(l.slice(1))}</td></tr>`;}
    else if(l.startsWith(&quot;-&quot;)){rows+=`<tr class=&quot;del&quot;><td class=&quot;ln&quot;>${old++}</td><td class=&quot;ln&quot;></td><td class=&quot;gut&quot;>-</td><td>${esc(l.slice(1))}</td></tr>`;}
    else{rows+=`<tr><td class=&quot;ln&quot;>${old++}</td><td class=&quot;ln&quot;>${neu++}</td><td class=&quot;gut&quot;></td><td>${esc(l.slice(1))}</td></tr>`;}
  });
  return `<div class=&quot;diff&quot;><table><tbody>${rows}</tbody></table></div>`;
}
function fmark(ch){return ch===&quot;added&quot;?'<span class=&quot;fmark m-added&quot;>A</span>':ch===&quot;deleted&quot;?'<span class=&quot;fmark m-deleted&quot;>D</span>':'<span class=&quot;fmark m-modified&quot;>M</span>';}
function barsq(a,d){
  const tot=a+d;let s='<span class=&quot;barsq&quot; aria-hidden=&quot;true&quot;>';
  const filled=Math.min(5,tot);
  const ai=tot?Math.round((a/tot)*filled):0;
  for(let i=0;i<5;i++){s+=`<i class=&quot;${i<ai?'a':(i<filled?'d':'')}&quot;></i>`;}
  return s+&quot;</span>&quot;;
}

}

function auditItems(s){
  let items=[];
  s.runs.forEach(r=>{
    items.push({t:(r.startedAt||&quot;&quot;).slice(11,16),who:`<b>${r.actor.split(&quot;@&quot;)[0]}</b> started run #${r.run}`,ic:&quot;▶&quot;});

  });
  if(s.status===&quot;running&quot;)items.push({t:&quot;live&quot;,who:&quot;currently running…&quot;,ic:&quot;◍&quot;});

  let j=JSON.stringify(obj,null,2);

    .replace(/(&amp;quot;(\\.|[^&amp;])*?&amp;quot;)(\s*:)/g,'<span class=&quot;j-key&quot;>$1</span>$3')
    .replace(/:\s*(&amp;quot;(\\.|[^&amp;])*?&amp;quot;)/g,': <span class=&quot;j-str&quot;>$1</span>')

// ---------------- helpers ----------------
const $ = s=>document.querySelector(s);
function fmtTime(iso){ if(!iso) return &quot;—&quot;; return iso.replace(&quot;T&quot;,&quot; &quot;).replace(&quot;Z&quot;,&quot; UTC&quot;); }
function clockTime(iso){ if(!iso) return &quot;—&quot;; return iso.slice(11,16); }
function fmtDur(ms){ if(ms==null) return &quot;—&quot;; const s=Math.round(ms/1000); const m=Math.floor(s/60), r=s%60; return m?`${m}m ${r}s`:`${r}s`; }
function esc(s){ return (s??&quot;&quot;).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/</g,&quot;&amp;lt;&quot;).replace(/>/g,&quot;&amp;gt;&quot;); }

// Fixed &quot;wall clock&quot; for this task snapshot so in-flight durations are stable
// and realistic (the Build stage started at 09:52:40Z; &quot;now&quot; is ~2m51s later)
// instead of drifting off the viewer's real system clock.
const SAMPLE_NOW = Date.parse(&quot;2026-07-07T09:55:31Z&quot;);

let selectedIx = 3;      // spec selected by default (shows the re-run story)

let viewRun = {};        // stageIndex -> which run pill is active

// ---------------- LEFT RAIL ----------------
function renderFlow(){
  const el = $(&quot;#flow&quot;); el.innerHTML=&quot;&quot;;
  STAGES.forEach(st=>{
    const reran = st.runs.length>1;
    const n=document.createElement(&quot;div&quot;);
    n.className=&quot;node&quot;+(st.stage_index===selectedIx?&quot; sel&quot;:&quot;&quot;);
    n.onclick=()=>selectStage(st.stage_index);
    let sub;
    if(st.status===&quot;running&quot;) sub=`${st.tool} · running ${fmtDur(SAMPLE_NOW-Date.parse(st.started_at))}`;
    else if(st.status===&quot;idle&quot;) sub=&quot;not started&quot;;
    else sub=`${fmtDur(st.duration_ms)} · ${clockTime(st.started_at)}`;
    n.innerHTML=`
      <div class=&quot;rail-line&quot;><div class=&quot;dot ${st.status}&quot;></div></div>
      <div class=&quot;card&quot;>
        <div class=&quot;top&quot;>
          <span class=&quot;ix&quot;>${st.stage_index}</span>
          <span class=&quot;nm&quot;>${st.stage_name}</span>
          <span class=&quot;badge ${st.status}&quot;>${st.status}</span>
        </div>
        <div class=&quot;sub&quot;>${sub}</div>
        ${reran?`<div class=&quot;rerun-flag&quot;>re-run · ${st.runs.length} runs (r1 failed)</div>`:&quot;&quot;}
      </div>`;
    el.appendChild(n);
  });
}

function selectStage(ix){ selectedIx=ix; activeTab= (STAGES[ix-1].status===&quot;idle&quot;)?&quot;prompt&quot;:activeTab; renderFlow(); renderInspector(); }

  const insp = $(&quot;#inspector&quot;);
  if(viewRun[selectedIx]==null) viewRun[selectedIx]=st.active_run ?? (st.runs[0]?.run ?? null);

  if(st.status===&quot;idle&quot;){
    insp.innerHTML = `
      ${headHTML(st)}
      <div class=&quot;tabwrap&quot;><div class=&quot;empty&quot;>
        <div class=&quot;big&quot;>Stage not started</div>
        <div>This <code style=&quot;font-family:var(--mono);color:var(--accent)&quot;>stage.json</code> exists as a skeleton — system prompt is set, everything else fills in on first run.</div>
        <div style=&quot;margin-top:14px&quot;><button class=&quot;edit&quot; style=&quot;font-family:var(--ui);font-size:13px;padding:7px 16px;border:1px solid var(--accent-dim);border-radius:7px;background:var(--panel);color:var(--accent)&quot;>▸ Run stage</button></div>
      </div></div>`;
    // still let them read the system prompt via prompt tab area — show it under empty
    insp.querySelector(&quot;.tabwrap&quot;).insertAdjacentHTML(&quot;beforeend&quot;,

       </div>`);
    return;
  }

  const filesN = st.files_changed.length;
  insp.innerHTML = `
    ${headHTML(st)}
    <div class=&quot;tabs&quot;>
      ${tabBtn(&quot;prompt&quot;,&quot;Prompt&quot;)}
      ${tabBtn(&quot;files&quot;,&quot;Files&quot;, filesN)}

}

  const exit = st.exit_code==null?&quot;—&quot;:st.exit_code;
  return `
    <div class=&quot;insp-head&quot;>

        <div class=&quot;kv&quot;><span class=&quot;k&quot;>duration</span><span class=&quot;v&quot;>${st.status===&quot;running&quot;?`<span style=&quot;color:var(--run)&quot;>${fmtDur(SAMPLE_NOW-Date.parse(st.started_at))} · running</span>`:fmtDur(st.duration_ms)}</span></div>

}

function pickRun(r){ viewRun[selectedIx]=r; renderInspector(); }

function tabBtn(id,label,count){
  const ct = count!=null?`<span class=&quot;ct&quot;>${count}</span>`:&quot;&quot;;
  return `<button class=&quot;tab ${activeTab===id?'on':''}&quot; data-tab=&quot;${id}&quot; onclick=&quot;pickTab('${id}')&quot;>${label}${ct}</button>`;
}
function pickTab(id){
  activeTab=id;
  document.querySelectorAll(&quot;.tab&quot;).forEach(t=>t.classList.toggle(&quot;on&quot;, t.getAttribute(&quot;data-tab&quot;)===id));
  renderTab();
}

function renderTab(){
  const st=STAGES[selectedIx-1];
  const w=$(&quot;#tabwrap&quot;); if(!w) return;
  const run = st.runs.find(r=>r.run===viewRun[selectedIx]);

  if(activeTab===&quot;prompt&quot;){

        <div style=&quot;font-family:var(--mono);font-size:11px;margin-top:6px&quot;>files_changed[] is empty for this run · switch to r${st.active_run} to see committed files</div>
      </div>`; return;
    }
    const add=st.files_changed.reduce((a,f)=>a+(f[&quot;+&quot;]||0),0);
    const del=st.files_changed.reduce((a,f)=>a+(f[&quot;-&quot;]||0),0);
    const mark={added:&quot;A&quot;,modified:&quot;M&quot;,deleted:&quot;D&quot;};
    w.innerHTML=`
      <div class=&quot;filestat&quot;>
        <span>${st.files_changed.length} files changed</span>
        <span class=&quot;s&quot;><span class=&quot;plus&quot;>▲</span> <span class=&quot;plus&quot;>+${add}</span></span>
        <span class=&quot;s&quot;><span class=&quot;minus&quot;>▼</span> <span class=&quot;minus&quot;>−${del}</span></span>
        ${st.result_commit?`<span style=&quot;color:var(--tx-mute)&quot;>in commit <span style=&quot;color:#c9a3ff&quot;>${esc(st.result_commit)}</span></span>`:`<span style=&quot;color:var(--run)&quot;>not yet committed (stage running)</span>`}
      </div>
      ${st.files_changed.map(f=>{
        const key=`${st.stage_index}::${f.path}`;
        const hasDiff=!!DIFFS[key];
        const dir=f.path.replace(/[^/]+$/,''), base=f.path.match(/[^/]+$/)[0];
        return `<div class=&quot;filerow ${hasDiff?'':''}&quot; onclick=&quot;${hasDiff?`toggleDiff(this,'${key}')`:''}&quot;>
            <span class=&quot;chg ${f.change}&quot;>${mark[f.change]}</span>
            <span class=&quot;path&quot;><span class=&quot;dir&quot;>${esc(dir)}</span>${esc(base)}</span>
            <span class=&quot;nums&quot;><span class=&quot;p&quot;>+${f[&quot;+&quot;]||0}</span><span class=&quot;m&quot;>−${f[&quot;-&quot;]||0}</span></span>
            <span class=&quot;caret&quot;>${hasDiff?'▸':' '}</span>
          </div>
          ${hasDiff?`<div class=&quot;diff&quot; data-diff=&quot;${key}&quot;>${DIFFS[key].map(([t,ln,txt])=>

// build the canonical stage record (matches storage schema, ordered)
function stageRecord(st){
  const rec={
    schema:&quot;bridza.stage/1&quot;, task:&quot;#506&quot;, flow:&quot;ship-flow&quot;,
    stage:st.stage, stage_index:st.stage_index, stage_name:st.stage_name,
    status:st.status, active_run:st.active_run, tool:st.tool, model:st.model,
    exit_code:st.exit_code, started_at:st.started_at, finished_at:st.finished_at, duration_ms:st.duration_ms,
    system_prompt:st.system_prompt, system_prompt_ref:st.system_prompt_ref, user_prompt:st.user_prompt,
    result_commit:st.result_commit, files_changed:st.files_changed,
    response:st.response, summary:st.summary, runs:st.runs, audit:st.audit
  };
  return rec;
}

// ---------------- edit affordance ----------------
function toggleEdit(btn,field){
  const box=document.querySelector(`[data-field=&quot;${field}&quot;]`);
  if(!box) return;
  const editing=box.getAttribute(&quot;contenteditable&quot;)===&quot;true&quot;;
  if(editing){
    box.setAttribute(&quot;contenteditable&quot;,&quot;false&quot;);
    btn.innerHTML=&quot;✎ Edit&quot;;
    // write back to record
    const st=STAGES[selectedIx-1];
    const val=box.innerText;
    if(field===&quot;sysprompt&quot;) st.system_prompt=val;
    if(field===&quot;userprompt&quot;) st.user_prompt=val;
    if(field===&quot;summary&quot;) st.summary=val;
    flashSaved(btn);
    syncStorage();
  } else {

function toggleDiff(row,key){

// ---------------- syntax coloring ----------------
// Tokenize on the raw JSON first (quotes still literal `&quot;`), THEN escape each
// piece, so keys/strings/numbers/literals get colored regardless of embedded
// &amp;, <, > or escaped chars in the value. The old &amp;quot;-based regex never
// matched because esc() leaves double-quotes untouched.
function colorJSON(obj){
  const src=JSON.stringify(obj,null,2);
  // string token = opening quote, any run of (escaped char | non-quote), closing quote
  const STR=/&quot;(?:\\.|[^&quot;\\])*&quot;/g;
  let out=&quot;&quot;, last=0, m;
  while((m=STR.exec(src))!==null){
    // plain text between the previous string and this one — color numbers + literals
    out+=colorScalars(esc(src.slice(last, m.index)));
    const tok=esc(m[0]);
    // is this string a key? (followed by optional ws then a colon)
    const after=src.slice(m.index+m[0].length);
    const isKey=/^\s*:/.test(after);
    out+=`<span class=&quot;${isKey?'k':'s'}&quot;>${tok}</span>`;
    last=m.index+m[0].length;

function colorScalars(s){
  return s
    .replace(/(-?\d+\.?\d*)/g,'<span class=&quot;n&quot;>$1</span>')
    .replace(/\b(true|false|null)\b/g,'<span class=&quot;b&quot;>$1</span>');
}
function colorResp(t){

  s=s.replace(/(→ 0 errors ✓|0 errors ✓|✓)/g,'<span class=&quot;ok&quot;>$1</span>');

}

function setView(v){

});

/* ---------------- HELPERS ---------------- */
const STLABEL={done:&quot;Done&quot;,running:&quot;Running&quot;,failed:&quot;Failed&quot;,idle:&quot;Idle&quot;};
function stClass(s){return {done:&quot;st-done&quot;,running:&quot;st-running&quot;,failed:&quot;st-failed&quot;,idle:&quot;st-idle&quot;}[s]}
function fmtDur(ms){if(!ms)return &quot;—&quot;;const s=Math.round(ms/1000);if(s<60)return s+&quot;s&quot;;const m=Math.floor(s/60);return m+&quot;m &quot;+(s%60)+&quot;s&quot;}
function fmtTime(iso){if(!iso)return &quot;—&quot;;const d=new Date(iso);return d.toISOString().slice(0,16).replace(&quot;T&quot;,&quot; &quot;)+&quot; UTC&quot;}
function esc(s){return (s||&quot;&quot;).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/</g,&quot;&amp;lt;&quot;).replace(/>/g,&quot;&amp;gt;&quot;)}
function commitLabel(c){return c?c:&quot;—&quot;}
function hasFail(st){return st.runs.some(r=>r.status===&quot;failed&quot;)}

/* ---------------- RAIL ---------------- */
function buildRail(){
  const rail=document.getElementById('rail');
  rail.innerHTML='';
  STAGES.forEach((st,i)=>{
    const node=document.createElement('div');node.className='rnode';
    const s=st.summary.status;
    const cls = s==='done'?'s-done':(s==='running'?'s-running':(s==='failed'?'s-done':'s-idle'));
    const rerun = hasFail(st)? `<span class=&quot;rerunb&quot; title=&quot;re-run after a failure&quot;>↻${st.summary.runs}</span>`:'';
    const sub = s==='running'?'running…':(s==='idle'?'not run':(hasFail(st)?st.summary.runs+' runs':'done'));
    node.innerHTML=`<div class=&quot;rdot ${cls}&quot; onclick=&quot;openCard(${i},true)&quot;>
        <div class=&quot;rcirc&quot;>${s==='done'?'✓':(s==='running'?'●':st.index)}${rerun}</div>
        <div class=&quot;rlabel&quot;>${st.title}</div>
        <div class=&quot;rsub&quot;>${sub}</div>
      </div>${i<STAGES.length-1?'<div class=&quot;rline&quot;></div>':''}`;
    rail.appendChild(node);
  });
}

/* ---------------- BOARD ---------------- */
function buildBoard(){
  const board=document.getElementById('board');

function makeCard(st,i){
  const s=st.summary;
  const card=document.createElement('div');
  card.className='card'+(s.status==='running'?' s-running':'')+(hasFail(st)&amp;&amp;s.status!=='running'?' s-failed-run':'');

             : '<i style=&quot;flex:1;background:var(--panel2)&quot;></i>';

  card.innerHTML=`
    <div class=&quot;cface&quot; onclick=&quot;toggleCard(${i})&quot;>

        <div class=&quot;cidx&quot;>${st.index}</div>

        <div class=&quot;stat&quot;><div class=&quot;k&quot;>Files</div><div class=&quot;v&quot;>${s.files_touched}</div></div>
        <div class=&quot;stat&quot;><div class=&quot;k&quot;>Runs</div><div class=&quot;v&quot;>${s.runs}${hasFail(st)?' ↻':''}</div></div>
        <div class=&quot;stat&quot;><div class=&quot;k&quot;>Commit</div><div class=&quot;v ${s.status==='done'||s.status==='failed'?'ok':''}&quot;>${commitLabel(s.last_commit)}</div></div>
      </div>
    </div>
    <div class=&quot;cfoot&quot; onclick=&quot;toggleCard(${i})&quot;>
      <span>updated ${s.updated_at?fmtTime(s.updated_at):'—'}</span>

        <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.5&quot;><path d=&quot;M6 9l6 6 6-6&quot;/></svg>
      </span>

function paneFiles(latest){

  const mk={added:'+',modified:'~',deleted:'−'};
  return `<div class=&quot;files&quot;>${latest.files.map(f=>`
    <div class=&quot;frow&quot;>
      <span class=&quot;fmark ${f.change}&quot;>${mk[f.change]}</span>

      <span class=&quot;ftag&quot;>${f.change}</span>
    </div>`).join('')}</div>

}

/* ---------------- INTERACTIONS ---------------- */
function toggleCard(i){
  const c=document.getElementById('card-'+i);
  c.classList.toggle('open');
  if(c.classList.contains('open')) c.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openCard(i,scroll){
  const c=document.getElementById('card-'+i);
  if(!c.classList.contains('open')) c.classList.add('open');
  if(scroll) c.scrollIntoView({behavior:'smooth',block:'center'});
}
function tab(i,n,btn){
  const tabs=btn.parentElement.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  for(let k=0;k<5;k++){document.getElementById(`pane-${i}-${k}`).classList.toggle('active',k===n)}
}
function tabByIndex(i,n){
  const btns=document.querySelectorAll(`#detail-${i} .tab`);
  if(btns[n]) tab(i,n,btns[n]);
}
function editField(btn,id){
  const el=document.getElementById(id);
  const on=el.getAttribute('contenteditable')==='true';
  const field=btn.closest('.field');
  const hint=field.querySelector('.savehint');
  const saved=field.querySelector('.saved');
  if(on){
    el.setAttribute('contenteditable','false');
    btn.innerHTML=penIcon()+'Edit';btn.classList.remove('saving');
    if(hint)hint.classList.remove('show');
    if(saved){saved.classList.add('show');setTimeout(()=>saved.classList.remove('show'),1800)}
  }else{
    el.setAttribute('contenteditable','true');el.focus();
    btn.innerHTML=penIcon()+'Save';btn.classList.add('saving');
    if(hint)hint.classList.add('show');
    if(saved)saved.classList.remove('show');
  }
}

function highlightJSON(src){
  let s=src.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');
  const lines=s.split('\n').map(line=>{
    let annot='';
    const m=line.match(/«(.*)$/);
    if(m){annot=m[1].trim();line=line.replace(/«.*$/,'');}
    // key: &quot;x&quot;  (only the first key on a line carries the annotation)
    let firstKey=true;
    line=line.replace(/(&quot;(?:[^&quot;\\]|\\.)*&quot;)(\s*:)/g,(_,k,c)=>{
      const key=`<span class=&quot;j-key&quot;>${k}</span>`;
      const out = (annot&amp;&amp;firstKey)? `<span class=&quot;j-map&quot; title=&quot;${annot.replace(/&quot;/g,'&amp;quot;')}&quot;>${key}</span>${c}` : key+c;
      firstKey=false;
      return out;
    });
    // remaining string values
    line=line.replace(/:(\s*)(&quot;(?:[^&quot;\\]|\\.)*&quot;)/g,(_,sp,v)=>`:${sp}<span class=&quot;j-str&quot;>${v}</span>`);
    // standalone quoted values inside arrays
    line=line.replace(/(^|\s|\[)(&quot;(?:[^&quot;\\]|\\.)*&quot;)(\s*[,\]]|$)/g,(mm,pre,v,post)=>{
      if(mm.includes('j-str')||mm.includes('j-key'))return mm;
      return `${pre}<span class=&quot;j-str&quot;>${v}</span>${post}`;
    });
    // numbers
    line=line.replace(/:(\s*)(-?\d+\.?\d*)/g,(_,sp,n)=>`:${sp}<span class=&quot;j-num&quot;>${n}</span>`);
    // bools / null
    line=line.replace(/\b(true|false)\b/g,'<span class=&quot;j-bool&quot;>$1</span>');
    line=line.replace(/\b(null)\b/g,'<span class=&quot;j-null&quot;>$1</span>');
    if(annot) line+=`  <span class=&quot;j-punc&quot; style=&quot;opacity:.55&quot;>◂ ${annot}</span>`;
    return line;
  });
  return lines.join('\n');
}

function pickFile(f){

}

  --dim:oklch(0.58 0.02 165); --mid:oklch(0.72 0.02 165); --bright:oklch(0.86 0.015 165); --white:oklch(0.95 0.008 165);
  --done:oklch(0.74 0.13 155); --fail:oklch(0.66 0.18 27); --run:oklch(0.72 0.11 235); --warn:oklch(0.74 0.12 62);
  --edit:oklch(0.72 0.13 305); --file:oklch(0.74 0.08 190);
  --sel:oklch(0.28 0.03 165);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ground);color:var(--bright);
  font-family:var(--mono);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-ligatures:none;
}
::selection{background:var(--sel);color:var(--white)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--amber);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- top chrome ---------- */
.top{
  display:flex;align-items:center;gap:16px;height:46px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--panel-2);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;color:var(--white);letter-spacing:.02em}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.brand b{font-weight:600}
.brand .v{color:var(--dim);font-size:11px}
.crumbs{color:var(--dim);font-size:12px;display:flex;gap:7px;align-items:center;flex:1;min-width:0;overflow:hidden}
.crumbs .sep{color:var(--line-2)}
.crumbs b{color:var(--mid);font-weight:400}
.crumbs .task{color:var(--amber)}
.viewtoggle{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.viewtoggle button{padding:6px 13px;color:var(--dim);font-size:12px;letter-spacing:.03em}
.viewtoggle button[aria-selected=true]{background:var(--raise);color:var(--white)}
.viewtoggle button:not(:last-child){border-right:1px solid var(--line)}
.viewtoggle button:hover{color:var(--bright)}
.kbhint{font-size:11px;color:var(--dim)}
.kbhint kbd{
  font-family:var(--mono);background:var(--raise);border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mid);font-size:10px;
}

/* ---------- layout ---------- */
.view{display:none}
.view.active{display:block}
.shell{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 46px)}
@media(max-width:820px){.shell{grid-template-columns:1fr;height:auto}}

/* ---------- left rail: stage flow ---------- */
.rail{border-right:1px solid var(--line);background:var(--panel-2);overflow-y:auto;padding:14px 0}
.rail h2{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:0 0 4px;padding:0 16px;font-weight:600;
}
.rail .flowmeta{padding:0 16px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.rail .flowmeta .branch{color:var(--mid);font-size:11px;display:flex;align-items:center;gap:6px}
.rail .flowmeta .branch svg{flex:none}
.progress{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden;display:flex;gap:1px}
.progress i{display:block;height:100%}
.progress i.done{background:var(--done)}
.progress i.run{background:var(--run);animation:pulse 1.6s ease-in-out infinite}
.progress i.idle{background:var(--line-2)}
.stage{
  display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;
  padding:9px 16px;position:relative;width:100%;text-align:left;
}
.stage:hover{background:var(--panel)}
.stage[aria-current=true]{background:var(--raise)}
.stage .no{
  font-size:11px;color:var(--dim);text-align:center;padding-top:1px;
  border:1px solid var(--line-2);border-radius:5px;height:22px;line-height:20px;
}
.stage[aria-current=true] .no{color:var(--amber);border-color:var(--amber-dim);background:oklch(0.24 0.03 82)}
.stage .body{min-width:0}
.stage .name{color:var(--bright);font-size:12.5px;display:flex;align-items:center;gap:7px}
.stage .sub{color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .connector{position:absolute;left:28px;top:31px;bottom:-9px;width:1px;background:var(--line)}
.stage:last-child .connector{display:none}
.stbadge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:20px;border:1px solid transparent;display:inline-flex;align-items:center;gap:4px}
.stbadge.done{color:var(--done);border-color:oklch(0.4 0.08 155);background:oklch(0.24 0.04 155)}
.stbadge.failed{color:var(--fail);border-color:oklch(0.42 0.12 27);background:oklch(0.24 0.06 27)}
.stbadge.running{color:var(--run);border-color:oklch(0.42 0.08 235);background:oklch(0.23 0.04 235)}
.stbadge.idle{color:var(--dim);border-color:var(--line-2)}
.dotpulse{width:6px;height:6px;border-radius:50%;background:var(--run);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}

.railfoot{padding:14px 16px;color:var(--dim);font-size:11px;line-height:1.7}
.railfoot .gp{color:var(--amber)}

/* ---------- main stream ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--ground)}
.streamhead{border-bottom:1px solid var(--line);background:var(--panel-2)}
.sh-row1{display:flex;align-items:center;gap:14px;padding:11px 16px 9px}
.sh-title{color:var(--white);font-size:14px;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.sh-title .stno{color:var(--amber)}
.runpills{display:flex;gap:6px;margin-left:4px}
.runpill{
  font-size:11px;padding:3px 9px;border:1px solid var(--line-2);border-radius:5px;color:var(--dim);
  display:flex;align-items:center;gap:6px;
}
.runpill[aria-selected=true]{border-color:var(--amber-dim);color:var(--bright);background:var(--raise)}
.runpill .rdot{width:6px;height:6px;border-radius:50%}
.runpill .rdot.done{background:var(--done)} .runpill .rdot.failed{background:var(--fail)} .runpill .rdot.running{background:var(--run)}
.sh-spacer{flex:1}
.metaquick{display:flex;gap:16px;color:var(--dim);font-size:11px;flex-wrap:wrap}
.metaquick b{color:var(--mid);font-weight:400}

.sh-row2{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
.grep{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--ground);
  border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;min-width:0;
}
.grep:focus-within{border-color:var(--amber-dim);box-shadow:0 0 0 1px var(--amber-dim)}
.grep .prompt{color:var(--amber);flex:none}
.grep input{
  flex:1;background:none;border:none;outline:none;color:var(--bright);
  font-family:var(--mono);font-size:12.5px;min-width:0;
}
.grep input::placeholder{color:var(--dim)}
.grep .count{color:var(--dim);font-size:11px;flex:none}
.typefilters{display:flex;gap:5px;flex-wrap:wrap}
.tf{
  font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;
  border:1px solid var(--line-2);border-radius:5px;color:var(--dim);display:flex;align-items:center;gap:5px;
}
.tf .sw{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.9}
.tf[aria-pressed=true]{color:var(--bright);border-color:currentColor;background:var(--panel)}
.tf.open{color:var(--amber)} .tf.log{color:var(--mid)} .tf.file{color:var(--file)}
.tf.response{color:var(--done)} .tf.error{color:var(--fail)} .tf.edit{color:var(--edit)} .tf.end{color:var(--warn)}

/* stream body */
.stream{flex:1;overflow-y:auto;padding:6px 0 40px;font-variant-numeric:tabular-nums}
.runsep{
  display:flex;align-items:center;gap:12px;padding:14px 16px 8px;color:var(--dim);font-size:11px;
}
.runsep .rline{flex:1;height:1px;background:var(--line)}
.runsep .rtag{letter-spacing:.1em;text-transform:uppercase}
.runsep .rtag.failed{color:var(--fail)} .runsep .rtag.done{color:var(--done)} .runsep .rtag.running{color:var(--run)}

/* event rows — accent carried by a leading glyph + tint, never a side stripe */
.ev{
  display:grid;grid-template-columns:20px 52px 96px 62px 1fr;gap:0;align-items:baseline;
  padding:2px 16px 2px 8px;position:relative;cursor:default;scroll-margin-top:8px;
}
.ev:hover{background:var(--panel)}
.ev.selected{background:var(--sel);box-shadow:inset 0 0 0 1px var(--amber-dim)}
.ev.expandable{cursor:pointer}
.ev .gut{color:var(--line-2);text-align:center;font-size:10px;line-height:1.6}
.ev .seq{color:oklch(0.42 0.014 165);font-size:11px}
.ev .ts{color:var(--dim);font-size:11px}
.ev .tt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}
.ev .msg{color:var(--mid);white-space:pre-wrap;word-break:break-word}
.ev .msg .k{color:var(--dim)}
.ev.t-open .gut{color:var(--amber)} .ev.t-open .tt{color:var(--amber)}
.ev.t-log .tt{color:var(--dim)} .ev.t-log .msg{color:var(--mid)}
.ev.t-file .gut{color:var(--file)} .ev.t-file .tt{color:var(--file)}
.ev.t-response .gut{color:var(--done)} .ev.t-response .tt{color:var(--done)}
.ev.t-error{background:oklch(0.21 0.04 27)} .ev.t-error .gut{color:var(--fail)} .ev.t-error .tt{color:var(--fail)} .ev.t-error .msg{color:oklch(0.78 0.09 27)}
.ev.t-edit .gut{color:var(--edit)} .ev.t-edit .tt{color:var(--edit)}
.ev.t-end .gut{color:var(--warn)} .ev.t-end .tt{color:var(--warn)}
.ev .caret{color:var(--dim);font-size:10px;margin-right:6px;display:inline-block;width:9px}
.ev.open .caret{color:var(--amber)}
.filetag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;margin-right:7px;border:1px solid;font-weight:600}
.filetag.add{color:var(--done);border-color:oklch(0.4 0.08 155)} .filetag.mod{color:var(--warn);border-color:oklch(0.42 0.08 62)} .filetag.del{color:var(--fail);border-color:oklch(0.42 0.12 27)}
.diffn{color:var(--dim);font-size:11px}
.diffn .p{color:var(--done)} .diffn .m{color:var(--fail)}
.statuschip{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:20px;margin-left:2px}
.statuschip.done{color:var(--done);background:oklch(0.24 0.04 155);border:1px solid oklch(0.4 0.08 155)}
.statuschip.failed{color:var(--fail);background:oklch(0.24 0.06 27);border:1px solid oklch(0.42 0.12 27)}
.statuschip.running{color:var(--run);background:oklch(0.23 0.04 235);border:1px solid oklch(0.42 0.08 235)}

/* expanded detail card under an event */
.detail{grid-column:1/-1;margin:6px 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.detail .dtabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.detail .dtab{padding:7px 13px;font-size:11px;letter-spacing:.04em;color:var(--dim);border-right:1px solid var(--line)}
.detail .dtab[aria-selected=true]{color:var(--white);background:var(--panel);box-shadow:inset 0 -2px 0 var(--amber)}
.detail .dtab:hover{color:var(--bright)}
.detail .dbody{padding:13px 15px}
.dpanel{display:none} .dpanel.active{display:block}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.field .lbl .req{color:var(--amber-dim);font-size:9px;border:1px solid var(--amber-dim);border-radius:3px;padding:0 4px}
.prosebox{
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  color:var(--bright);white-space:pre-wrap;line-height:1.6;font-size:12.5px;
}
.prosebox .tagline{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;color:var(--dim)}
.prosebox.sys .tagline{color:var(--amber)}
.prosebox.usr .tagline{color:var(--run)}
.prosebox[contenteditable=true]{outline:none;box-shadow:0 0 0 1px var(--amber-dim);border-color:var(--amber-dim)}
.kvgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;font-size:12px}
.kvgrid .k{color:var(--dim)} .kvgrid .val{color:var(--bright)}
.kvgrid .val.mono2{color:var(--amber)}
.editrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{
  border:1px solid var(--line-2);border-radius:6px;padding:5px 12px;color:var(--mid);font-size:11px;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--amber-dim);color:var(--bright)}
.btn.primary{border-color:var(--amber-dim);color:var(--amber)}
.btn.primary:hover{background:oklch(0.24 0.03 82)}
.savedflash{color:var(--done);font-size:11px;opacity:0;transition:opacity .2s}
.savedflash.show{opacity:1}
.filelist{display:flex;flex-direction:column;gap:4px}
.filerow{display:flex;align-items:center;gap:10px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2)}
.filerow .path{color:var(--bright);font-size:12px;flex:1}
.audit{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.audit .arow{display:flex;gap:10px;align-items:baseline;font-size:11.5px;color:var(--dim);padding:3px 0}
.audit .arow .who{color:var(--edit)} .audit .arow .when{color:var(--mid)} .audit .arow .act{color:var(--bright)}
.audit .diffwas{color:var(--fail);text-decoration:line-through;opacity:.7}
.audit .diffnow{color:var(--done)}

/* running footer / live */
.livebar{
  border-top:1px solid var(--line);background:var(--panel-2);padding:8px 16px;
  display:flex;align-items:center;gap:12px;color:var(--dim);font-size:11px;
}
.livebar .live{color:var(--run);display:flex;align-items:center;gap:7px}
.cursor{display:inline-block;width:8px;height:14px;background:var(--amber);animation:blink 1s steps(1) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}

/* ---------- STORAGE view ---------- */
.storage{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
.storage h1{font-size:16px;color:var(--white);font-weight:600;letter-spacing:.01em;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.storage .lede{color:var(--mid);font-size:12.5px;max-width:74ch;line-height:1.7;margin:0 0 22px}
.storage .lede code{color:var(--amber);background:var(--panel);padding:1px 5px;border-radius:4px}
.stgrid{display:grid;grid-template-columns:340px 1fr;gap:22px}
@media(max-width:900px){.stgrid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);overflow:hidden}
.card .ch{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--mid);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.card .ch .hint{color:var(--dim);text-transform:none;letter-spacing:0;font-size:11px}
.tree{padding:12px 8px;font-size:12.5px;line-height:1.85}
.tree .t{white-space:pre;color:var(--line-2)}
.tree .node{display:flex;align-items:baseline;gap:0;padding:1px 6px;border-radius:5px;width:100%;text-align:left}
.tree .node:hover{background:var(--panel)}
.tree .node[aria-current=true]{background:var(--raise)}
.tree .dir{color:var(--amber)}
.tree .fileN{color:var(--bright)}
.tree .cmt{color:var(--dim);font-size:11px;margin-left:10px}
.tree .st{font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-left:8px;padding:0 5px;border-radius:10px;border:1px solid}
.tree .st.done{color:var(--done);border-color:oklch(0.4 0.08 155)} .tree .st.failed{color:var(--fail);border-color:oklch(0.42 0.12 27)}
.tree .st.running{color:var(--run);border-color:oklch(0.42 0.08 235)} .tree .st.idle{color:var(--dim);border-color:var(--line-2)}

.jsonl{position:relative}
.jsonl .jhead{display:flex;align-items:center;gap:12px}
.jsonl .fname{color:var(--amber)}
.jsonl .fmeta{color:var(--dim);font-size:11px}
.jsonlbody{padding:0;overflow-x:auto;max-height:560px;overflow-y:auto}
.jline{
  display:grid;grid-template-columns:20px 34px 1fr;gap:0;padding:2px 12px 2px 4px;font-size:12px;
}
.jline:hover{background:var(--panel)}
.jline .jgut{text-align:center;font-size:10px;color:var(--line-2);user-select:none;line-height:1.6}
.jline .ln{color:oklch(0.4 0.014 165);text-align:right;padding-right:12px;user-select:none;font-size:11px}
.jline .code{white-space:pre;color:var(--mid)}
.jline.blank{min-height:12px}
.jline.hl{background:var(--sel)}
.jl-open .jgut{color:var(--amber)} .jl-error .jgut{color:var(--fail)}
.jl-file .jgut{color:var(--file)} .jl-response .jgut{color:var(--done)}
.jl-edit .jgut{color:var(--edit)} .jl-end .jgut{color:var(--warn)} .jl-log .jgut{color:var(--dim)}
.tok-key{color:oklch(0.72 0.08 235)} .tok-str{color:oklch(0.78 0.1 140)} .tok-num{color:oklch(0.78 0.11 75)} .tok-t{color:var(--amber)} .tok-punc{color:var(--line-2)} .tok-null{color:var(--fail)} .tok-bool{color:var(--edit)}

.fieldmap{margin-top:22px}
.fieldmap .card .ch{justify-content:flex-start;gap:12px}
.fmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:14px}
.fmcell{border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:var(--panel)}
.fmcell .ev-t{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:inline-block;padding:1px 7px;border-radius:4px;border:1px solid}
.fmcell .ev-t.open{color:var(--amber);border-color:var(--amber-dim)}
.fmcell .ev-t.file{color:var(--file);border-color:oklch(0.42 0.06 190)}
.fmcell .ev-t.response{color:var(--done);border-color:oklch(0.4 0.08 155)}
.fmcell .ev-t.end{color:var(--warn);border-color:oklch(0.42 0.08 62)}
.fmcell .ev-t.edit{color:var(--edit);border-color:oklch(0.42 0.09 305)}
.fmcell ul{margin:0;padding-left:16px;color:var(--mid);font-size:11.5px;line-height:1.7}
.fmcell ul li b{color:var(--bright);font-weight:400}
.grepbox{margin-top:22px}
.grepbox .card{background:var(--panel-2)}
.grepline{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.grepline:last-child{border-bottom:none}
.grepline .cmd{color:var(--bright)}
.grepline .cmd .p{color:var(--amber)}
.grepline .cmd .fl{color:var(--run)}
.grepline .cmd .q{color:oklch(0.78 0.1 140)}
.grepline .res{color:var(--dim);font-size:11px}

.footnote{color:var(--dim);font-size:11.5px;margin-top:20px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
.footnote b{color:var(--amber);font-weight:400}

/* generic scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--ground)}
::-webkit-scrollbar-track{background:transparent}
</style>

  <!-- LEFT RAIL -->

/* ---- helpers ---- */
function fmtTs(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,&quot;0&quot;);
  return p(d.getUTCHours())+&quot;:&quot;+p(d.getUTCMinutes())+&quot;:&quot;+p(d.getUTCSeconds())+&quot;.&quot;+String(d.getUTCMilliseconds()).padStart(3,&quot;0&quot;);}
function fmtDate(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,&quot;0&quot;);
  return d.getUTCFullYear()+&quot;-&quot;+p(d.getUTCMonth()+1)+&quot;-&quot;+p(d.getUTCDate())+&quot; &quot;+p(d.getUTCHours())+&quot;:&quot;+p(d.getUTCMinutes())+&quot; UTC&quot;;}
function fmtDur(ms){if(ms==null)return&quot;—&quot;;const s=ms/1000;return s<60?s.toFixed(1)+&quot;s&quot;:Math.floor(s/60)+&quot;m &quot;+Math.round(s%60)+&quot;s&quot;;}
function esc(s){return String(s).replace(/[&amp;<>]/g,c=>({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;<&quot;:&quot;&amp;lt;&quot;,&quot;>&quot;:&quot;&amp;gt;&quot;}[c]));}

/* flatten a run into ordered events */
function runEvents(st,r){
  const list=[];let seq=0;
  list.push({t:&quot;open&quot;,seq:seq++,run:r.run,ts:r.open.ts,open:r.open,st,r});
  for(const e of r.events){list.push(Object.assign({seq:seq++,run:r.run,ts:e.ts||r.open.ts},e,{st,r}));}
  if(r.end){list.push({t:&quot;end&quot;,seq:seq++,run:r.run,ts:r.open.ts,end:r.end,st,r});}
  return list;
}

function matchGrep(e){

  let hay=e.t+&quot; &quot;;
  if(e.t===&quot;open&quot;)hay+=e.open.sys+&quot; &quot;+e.open.usr+&quot; &quot;+e.open.tool+&quot; &quot;+e.open.model+&quot; &quot;+e.open.actor;

  if(e.t===&quot;file&quot;)hay+=e.path+&quot; &quot;+e.op;
  if(e.t===&quot;response&quot;)hay+=e.text;
  if(e.t===&quot;edit&quot;)hay+=(e.was+&quot; &quot;+e.now+&quot; &quot;+e.field+&quot; &quot;+e.note);
  if(e.t===&quot;end&quot;)hay+=e.end.summary+&quot; &quot;+e.end.status+(e.end.commit||&quot;&quot;);
  return hay.toLowerCase().includes(q);
}

function renderStream(){
  const st=STAGES[curStage];
  document.getElementById(&quot;stTitleNo&quot;).textContent=String(st.no).padStart(2,&quot;0&quot;);
  document.getElementById(&quot;stTitleName&quot;).textContent=st.name;
  const stream=document.getElementById(&quot;stream&quot;);

  if(st.runs.length===0){
    stream.innerHTML=`<div style=&quot;padding:60px 20px;text-align:center;color:var(--dim)&quot;>
      <div style=&quot;font-size:26px;color:var(--line-2);margin-bottom:12px&quot;>⌁</div>
      <div style=&quot;color:var(--mid);margin-bottom:6px&quot;>stage <b style=&quot;color:var(--amber)&quot;>${st.name}</b> is idle</div>
      <div style=&quot;font-size:12px&quot;>run.jsonl is empty. No <span style=&quot;color:var(--amber)&quot;>open</span> event yet.</div>
      <div style=&quot;margin-top:16px&quot;><button class=&quot;btn primary&quot; onclick=&quot;alert('(demo) would append an open event and start tailing.')&quot;>▶ Run stage</button></div>
    </div>`;
    document.getElementById(&quot;grepCount&quot;).textContent=&quot;&quot;;
    document.getElementById(&quot;livebar&quot;).style.display=&quot;none&quot;;
    return;
  }

  const runs=curRunIdx===null?st.runs:[st.runs[curRunIdx]];
  let html=&quot;&quot;,shown=0,total=0;

  for(const r of runs){
    const evs=runEvents(st,r);
    if(curRunIdx===null &amp;&amp; st.runs.length>1){
      const tag=r.status;
      const label=r.rerun_of?`run ${r.run} · rerun of run ${r.rerun_of}`:`run ${r.run}`;
      html+=`<div class=&quot;runsep&quot;><span class=&quot;rline&quot;></span><span class=&quot;rtag ${tag}&quot;>${label} · ${tag}</span><span class=&quot;rline&quot;></span></div>`;
    }
    for(const e of evs){
      total++;
      if(OFF.has(e.t))continue;
      if(!matchGrep(e))continue;
      shown++;
      html+=renderEvent(e);
    }
  }
  stream.innerHTML=html||`<div style=&quot;padding:40px;text-align:center;color:var(--dim)&quot;>no lines match. Clear the grep filter.</div>`;
  document.getElementById(&quot;grepCount&quot;).textContent=grepQ||OFF.size?`${shown} / ${total} lines`:`${total} lines`;

  document.getElementById(&quot;livebar&quot;).style.display=st.status===&quot;running&quot;?&quot;flex&quot;:&quot;none&quot;;

  if(expandedKey){
    const row=stream.querySelector(`[data-key=&quot;${cssq(expandedKey)}&quot;]`);
    if(row)openDetail(row,true);
  }
}

function cssq(s){return s.replace(/[^a-zA-Z0-9_:.\-]/g,&quot;\\$&amp;&quot;);}

function renderEvent(e){
  const key=evKey(e);
  const sel=key===selectedKey?&quot; selected&quot;:&quot;&quot;;
  const ts=fmtTs(e.ts);
  const seq=String(e.seq).padStart(2,&quot;0&quot;);
  const expandable=(e.t===&quot;open&quot;||e.t===&quot;end&quot;||e.t===&quot;response&quot;||e.t===&quot;edit&quot;);
  let msg=&quot;&quot;;

  if(e.t===&quot;open&quot;){
    const o=e.open;
    msg=`<span class=&quot;caret&quot;>▸</span><span class=&quot;k&quot;>stage opened</span> · ${o.tool}/${o.model.replace('claude-','')} · <span class=&quot;k&quot;>trigger</span> ${o.trigger}${o.rerun_of?` (rerun of run ${o.rerun_of})`:&quot;&quot;} · <span class=&quot;k&quot;>by</span> ${o.actor}`;
  } else if(e.t===&quot;log&quot;){
    msg=esc(e.line);
  } else if(e.t===&quot;error&quot;){
    msg=esc(e.line);
  } else if(e.t===&quot;file&quot;){
    msg=`<span class=&quot;filetag ${e.op}&quot;>${e.op}</span><span style=&quot;color:var(--bright)&quot;>${esc(e.path)}</span> <span class=&quot;diffn&quot;><span class=&quot;p&quot;>+${e[&quot;+&quot;]}</span> <span class=&quot;m&quot;>−${e[&quot;-&quot;]}</span></span>`;
  } else if(e.t===&quot;response&quot;){
    const first=e.text.split(&quot;\n&quot;)[0];
    msg=`<span class=&quot;caret&quot;>▸</span><span style=&quot;color:var(--done)&quot;>agent response</span> · ${esc(first)}${e.text.includes(&quot;\n&quot;)?' <span class=&quot;k&quot;>…</span>':&quot;&quot;}`;
  } else if(e.t===&quot;edit&quot;){
    msg=`<span class=&quot;caret&quot;>▸</span><span style=&quot;color:var(--edit)&quot;>human edit</span> · field <b style=&quot;color:var(--bright)&quot;>${e.field}</b> corrected by ${e.actor}`;
  } else if(e.t===&quot;end&quot;){
    const en=e.end;
    msg=`<span class=&quot;caret&quot;>▸</span><span class=&quot;statuschip ${en.status}&quot;>${en.status}</span> exit ${en.exit} · ${fmtDur(en.dur_ms)} · ${en.files} file${en.files===1?&quot;&quot;:&quot;s&quot;} · commit ${en.commit?`<span style=&quot;color:var(--amber)&quot;>${en.commit}</span>`:'<span style=&quot;color:var(--fail)&quot;>none</span>'}`;
  }

  return `<div class=&quot;ev t-${e.t}${sel}${expandable?&quot; expandable&quot;:&quot;&quot;}&quot; data-key=&quot;${key}&quot; tabindex=&quot;-1&quot;
      onclick=&quot;onEvClick(this,${expandable})&quot;>
    <span class=&quot;gut&quot; aria-hidden=&quot;true&quot;>${TYPE_GLYPH[e.t]}</span>
    <span class=&quot;seq&quot;>${seq}</span>
    <span class=&quot;ts&quot;>${ts}</span>
    <span class=&quot;tt&quot;>${TYPE_LABEL[e.t]}</span>
    <span class=&quot;msg&quot;>${msg}</span>
  </div>`;
}

function onEvClick(row,expandable){
  selectRow(row);
  if(expandable)toggleDetail(row);
}

function selectRow(row){
  document.querySelectorAll(&quot;.ev.selected&quot;).forEach(x=>x.classList.remove(&quot;selected&quot;));
  row.classList.add(&quot;selected&quot;);
  selectedKey=row.dataset.key;
}

function toggleDetail(row){
  const existing=row.nextElementSibling;
  if(existing&amp;&amp;existing.classList.contains(&quot;detail&quot;)){
    existing.remove();row.classList.remove(&quot;open&quot;);expandedKey=null;return;
  }
  document.querySelectorAll(&quot;.detail&quot;).forEach(d=>d.remove());
  document.querySelectorAll(&quot;.ev.open&quot;).forEach(x=>x.classList.remove(&quot;open&quot;));
  openDetail(row,false);
}

function findEvent(key){
  const [stNo,run,seq,t]=key.split(&quot;:&quot;);
  const st=STAGES[curStage];
  for(const r of st.runs){
    if(String(r.run)!==run)continue;
    for(const e of runEvents(st,r)){
      if(String(e.seq)===seq&amp;&amp;e.t===t)return e;
    }
  }
  return null;
}

function openDetail(row,reopen){
  const key=row.dataset.key;
  const e=findEvent(key);
  if(!e)return;
  if(row.nextElementSibling&amp;&amp;row.nextElementSibling.classList.contains(&quot;detail&quot;))return;
  row.classList.add(&quot;open&quot;);
  expandedKey=key;
  const card=document.createElement(&quot;div&quot;);
  card.className=&quot;detail&quot;;
  card.innerHTML=detailHTML(e,key);
  row.after(card);
  if(!reopen)card.scrollIntoView({block:&quot;nearest&quot;,behavior:&quot;smooth&quot;});
}

function dtab(btn,p){
  const tabs=btn.closest(&quot;.dtabs&quot;);
  tabs.querySelectorAll(&quot;.dtab&quot;).forEach(t=>t.setAttribute(&quot;aria-selected&quot;,&quot;false&quot;));

/* inline edit affordance */
function editField(id,btn){
  const box=document.getElementById(id);
  box.setAttribute(&quot;contenteditable&quot;,&quot;true&quot;);box.focus();
  const r=document.createRange();r.selectNodeContents(box);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
  btn.style.display=&quot;none&quot;;
  btn.nextElementSibling.style.display=&quot;inline-flex&quot;;
}
function saveField(id,btn){
  const box=document.getElementById(id);

}

/* =================== KEYBOARD NAV =================== */
function visibleRows(){return[...document.querySelectorAll(&quot;#view-display .ev&quot;)].filter(r=>r.offsetParent!==null);}
function moveSel(dir){
  const rows=visibleRows();if(!rows.length)return;
  let idx=rows.findIndex(r=>r.dataset.key===selectedKey);
  idx=idx<0?(dir>0?0:rows.length-1):Math.min(rows.length-1,Math.max(0,idx+dir));
  const row=rows[idx];selectRow(row);
  row.scrollIntoView({block:&quot;nearest&quot;});
}
document.addEventListener(&quot;keydown&quot;,e=>{
  if(document.querySelector(&quot;[contenteditable=true]&quot;))return;
  const inGrep=document.activeElement.id===&quot;grepInput&quot;;
  if(inGrep){
    if(e.key===&quot;Escape&quot;){document.getElementById(&quot;grepInput&quot;).blur();}
    return;
  }
  if(e.key===&quot;/&quot;){e.preventDefault();document.getElementById(&quot;grepInput&quot;).focus();return;}
  if(e.key===&quot;v&quot;||e.key===&quot;V&quot;){setView(document.getElementById(&quot;view-display&quot;).classList.contains(&quot;active&quot;)?&quot;storage&quot;:&quot;display&quot;);return;}
  if(!document.getElementById(&quot;view-display&quot;).classList.contains(&quot;active&quot;))return;
  if(e.key===&quot;j&quot;){e.preventDefault();moveSel(1);}
  else if(e.key===&quot;k&quot;){e.preventDefault();moveSel(-1);}
  else if(e.key===&quot;g&quot;){e.preventDefault();const r=visibleRows()[0];if(r){selectRow(r);r.scrollIntoView({block:&quot;center&quot;});}}
  else if(e.key===&quot;G&quot;){e.preventDefault();const rs=visibleRows();const r=rs[rs.length-1];if(r){selectRow(r);r.scrollIntoView({block:&quot;center&quot;});}}
  else if(e.key===&quot;Enter&quot;){e.preventDefault();const r=document.querySelector(&quot;.ev.selected&quot;);if(r&amp;&amp;r.classList.contains(&quot;expandable&quot;))toggleDetail(r);}
  else if(e.key>=&quot;1&quot;&amp;&amp;e.key<=&quot;5&quot;){e.preventDefault();selectStage(parseInt(e.key)-1);}
});

function tokenizeJson(line){
  if(line.startsWith(&quot;//&quot;)||line.startsWith(&quot;#&quot;))
    return `<span style=&quot;color:var(--dim)&quot;>${esc(line)}</span>`;
  if(line.trim()===&quot;&quot;)return &quot;&quot;;
  let out=&quot;&quot;;const re=/(&quot;(?:\\.|[^&quot;\\])*&quot;)(\s*:)?|(-?\d+\.?\d*)|\b(true|false)\b|\b(null)\b|([{}\[\],])/g;
  let last=0,m;
  while((m=re.exec(line))){
    out+=esc(line.slice(last,m.index));
    if(m[1]!==undefined&amp;&amp;m[2]!==undefined){
      const key=m[1];
      const cls=(key==='&quot;t&quot;')?&quot;tok-t&quot;:&quot;tok-key&quot;;
      out+=`<span class=&quot;${cls}&quot;>${esc(key)}</span><span class=&quot;tok-punc&quot;>${esc(m[2])}</span>`;
    } else if(m[1]!==undefined){
      out+=`<span class=&quot;tok-str&quot;>${esc(m[1])}</span>`;
    } else if(m[3]!==undefined){out+=`<span class=&quot;tok-num&quot;>${esc(m[3])}</span>`;}
    else if(m[4]!==undefined){out+=`<span class=&quot;tok-bool&quot;>${esc(m[4])}</span>`;}
    else if(m[5]!==undefined){out+=`<span class=&quot;tok-null&quot;>${esc(m[5])}</span>`;}
    else if(m[6]!==undefined){out+=`<span class=&quot;tok-punc&quot;>${esc(m[6])}</span>`;}
    last=re.lastIndex;
  }
  out+=esc(line.slice(last));
  return out;
}
function lineType(line){

  .fstep .node .toprow{display:flex;align-items:center;gap:7px}

    border:1px solid var(--bd);border-radius:4px;padding:0 4px}

  .fstep .node .sub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fstep .node .rr{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.3px;color:#f0b429;
    background:#3a2c0d;border:1px solid #5c470f;border-radius:4px;padding:0 4px}
  .fstep .node .led{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .fstep .node.done .led{background:var(--done)}
  .fstep .node.running .led{background:var(--run);animation:pulse 1.1s infinite}
  .fstep .node.failed .led{background:var(--fail)}
  .fstep .node.idle .led{background:var(--idle)}

  .fstep:last-child{flex:none}
  .fstep .node .barbg{position:absolute;left:0;bottom:0;height:2px;width:100%;background:transparent}
  .fstep .node.running .barbg{background:linear-gradient(90deg,var(--run),transparent);animation:sweep 1.6s linear infinite}
  @keyframes sweep{0%{opacity:.35}50%{opacity:.9}100%{opacity:.35}}

  /* ---- toolbar ---- */
  .toolbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--bg2);
    border-bottom:1px solid var(--bd);flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--bd);
    border-radius:7px;padding:5px 9px;min-width:240px;flex:1;max-width:380px}
  .search:focus-within{border-color:var(--bd2)}
  .search input{all:unset;flex:1;color:var(--txt);font-size:12px}
  .search input::placeholder{color:var(--dim2)}

  .kbd{font-family:var(--mono);font-size:10px;color:var(--dim2);border:1px solid var(--bd2);
    border-radius:4px;padding:1px 5px;background:#0a0e15}
  .filters{display:flex;gap:6px;align-items:center}
  .fchip{cursor:pointer;font-size:11px;font-weight:600;color:var(--dim);background:var(--panel2);

  .fchip.on{color:var(--txt);border-color:var(--bd2);background:#16202e}
  .fchip .dot{width:7px;height:7px;border-radius:50%}
  .fchip .ct{font-family:var(--mono);font-size:10px;color:var(--dim2)}
  .togsup{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px;cursor:pointer;user-select:none}
  .togsup .ctn{font-family:var(--mono);font-size:10px;color:var(--dim2)}
  .switch{width:30px;height:17px;border-radius:20px;background:#26303d;position:relative;transition:.15s;border:1px solid var(--bd2)}
  .switch b{position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;background:#8794a6;transition:.15s}
  .togsup.on .switch{background:var(--accent2)}
  .togsup.on .switch b{left:14px;background:#fff}

  /* ---- content ---- */
  .content{flex:1;overflow:auto;position:relative}
  .view{display:none}
  .view.on{display:block}

  /* ============ GRID ============ */
  table{border-collapse:collapse;width:100%;min-width:1120px;font-size:12.5px}
  thead th{position:sticky;top:0;z-index:5;background:#0d121b;text-align:left;
    padding:8px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--dim);font-weight:700;border-bottom:1px solid var(--bd2);white-space:nowrap;cursor:pointer;user-select:none}
  thead th .arw{opacity:0;font-size:9px;margin-left:3px}
  thead th.sorted{color:var(--txt)}
  thead th.sorted .arw{opacity:1;color:var(--accent)}
  thead th.nosort{cursor:default}
  tbody tr.rrow{border-bottom:1px solid #141b26;cursor:pointer}
  tbody tr.rrow:nth-child(odd){background:var(--row)}
  tbody tr.rrow:nth-child(even){background:var(--rowalt)}
  tbody tr.rrow:hover{background:var(--rowhov)}
  tbody tr.rrow.sel{background:var(--rowsel);box-shadow:inset 3px 0 0 var(--accent)}
  tbody tr.rrow.superseded td{opacity:.5}
  td{padding:8px 12px;vertical-align:middle;white-space:nowrap}
  td.summary{white-space:normal;max-width:340px;color:var(--dim);line-height:1.35}

  td.audit-cell{font-family:var(--mono);font-size:11px;color:var(--dim)}

  .stat{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11.5px}

  .stat.done{color:var(--done)} .stat.done .led{background:var(--done)}
  .stat.failed{color:var(--fail)} .stat.failed .led{background:var(--fail)}
  .stat.running{color:var(--run)} .stat.running .led{background:var(--run);animation:pulse 1.1s infinite}
  .stat.idle{color:var(--idle)} .stat.idle .led{background:var(--idle)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f0b42999}50%{box-shadow:0 0 0 4px #f0b42900}}

  .stagecell{display:flex;align-items:center;gap:8px}

    border:1px solid var(--bd);border-radius:5px;padding:1px 5px;min-width:18px;text-align:center}
  .stagename{font-weight:600;text-transform:capitalize}
  .runidx{font-family:var(--mono);font-size:10px;color:var(--dim2)}

    padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:.3px}

    padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:.3px;cursor:help}

  .tool{font-family:var(--mono);font-size:11px;color:var(--txt)}
  .tool .mdl{color:var(--dim);font-size:10.5px}

  .files-mini{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px}
  .fpill{padding:0 4px;border-radius:3px;font-size:10px;font-weight:700}
  .fpill.a{color:#7ee787;background:#12331d} .fpill.m{color:#e3b341;background:#33280c} .fpill.d{color:#ff8f92;background:#3a1315}
  .fnone{color:var(--dim2);font-style:italic}
  .sha{font-family:var(--mono);font-size:11px;color:#9db4ff}
  .sha.none{color:var(--dim2)}
  .expander{color:var(--dim2);transition:transform .15s,color .15s;display:inline-block}
  tr.sel .expander{color:var(--accent);transform:rotate(90deg)}

  /* ---- detail drawer ---- */
  tr.drawer-row>td{padding:0;background:var(--panel)}
  .drawer{border-top:1px solid var(--accent2);border-bottom:1px solid var(--bd2);
    background:linear-gradient(180deg,#0e141e,#0c1017);animation:slideIn .18s ease}

    background:#0d121b;flex-wrap:wrap}
  .dtitle{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dtitle .rid{font-family:var(--mono);font-size:11px;color:var(--dim);background:#0a0e15;
    border:1px solid var(--bd);padding:2px 7px;border-radius:5px}
  .dmeta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .dbtn{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--dim);
    border:1px solid var(--bd2);padding:5px 11px;border-radius:6px;display:flex;align-items:center;gap:6px;background:#0e131c}
  .dbtn:hover{color:var(--txt);border-color:#3a4658;background:#141b26}
  .dbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .dbtn.primary{color:#fff;background:var(--accent2);border-color:var(--accent2)}

  .dbtn.danger:hover{color:#ff8f92;border-color:#5c1a1c}

  .tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--bd);background:#0d121b;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;padding:9px 14px;font-size:12px;font-weight:600;color:var(--dim);
    border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
  .tab:hover{color:var(--txt)}
  .tab.on{color:var(--txt);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:4px}
  .tab .cnt{font-family:var(--mono);font-size:10px;color:var(--dim2);background:#0a0e15;padding:0 5px;border-radius:8px}

  .tabpane{display:none;padding:16px 18px 22px}
  .tabpane.on{display:block}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .fld{background:var(--panel2);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
