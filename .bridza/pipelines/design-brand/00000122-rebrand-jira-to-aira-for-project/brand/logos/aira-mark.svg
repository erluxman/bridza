      <stop offset="0" stop-color="#4F7BFF"/>
      <stop offset="1" stop-color="#6D6BFF"/>
    </linearGradient>
    <linearGradient id="airaRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4BFF"/>
